name: Timetable

on:
  schedule:
    # Every 15 minutes, all day: checks EduPage for changes, and (via `notify.mjs auto`) sends the
    # Sunday weekly post / daily evening reminder the first run that reaches their time each day.
    # GitHub's own schedule trigger is "best effort" and can miss a run — see step 5 of the README
    # for the Cloudflare Cron Trigger that nudges this workflow awake reliably in between.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Also send the weekly timetable post now'
        type: boolean
        default: false
      stats:
        description: 'Print subscriber counts and recent feedback to the log'
        type: boolean
        default: false
      announce:
        description: 'Broadcast this text to every active chat now (leave empty to skip)'
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['docs/**', '!docs/data/**', 'scripts/**', 'src/**', 'fonts/**']  # redeploy the Mini App / pictures when code changes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: timetable
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    timeout-minutes: 60
    environment:
      name: github-pages
    steps:
      # ref: main = the newest commit at the moment THIS run starts. Without it a run that waited in the queue behind another
      # one checks out the commit it was triggered at — a stale copy of the data, which made the bot treat old changes as new.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download timetable and detect changes
        id: update
        if: github.event_name != 'push'
        env:
          WEEK_A_MONDAY: ${{ vars.WEEK_A_MONDAY }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: node scripts/update.mjs

      - name: Save data to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Timetable update $(date -u +'%Y-%m-%d %H:%M') UTC" -q
            # if main moved while we were working (a code push), put our data commit on top of it and try again
            for i in 1 2 3 4 5; do
              git push -q && exit 0
              git pull --rebase -q origin main || { git rebase --abort || true; exit 1; }
              sleep $((i * 2))
            done
            exit 1
          fi

      # The pictures of the previous run come back from the cache, so only the timetables that changed are drawn again
      # (seconds instead of ~4 minutes) and the change alerts below go out that much sooner. The key changes with anything
      # that changes how a picture looks; a miss simply means everything is drawn, as before.
      - name: Restore weekly pictures from the previous run
        if: github.event_name == 'push' || steps.update.outputs.written != '0'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: docs/img
          key: img-${{ hashFiles('scripts/render.mjs', 'src/shared.mjs', 'docs/data/subjects.json', 'docs/icon-192.png', 'fonts/**', 'package-lock.json') }}-${{ github.run_id }}
          restore-keys: img-${{ hashFiles('scripts/render.mjs', 'src/shared.mjs', 'docs/data/subjects.json', 'docs/icon-192.png', 'fonts/**', 'package-lock.json') }}-

      - name: Draw weekly timetable pictures
        id: render
        if: github.event_name == 'push' || steps.update.outputs.written != '0'
        run: |
          # exactly the versions in package-lock.json, and no package may run an install script (those would run with the
          # repository write token on disk) — the picture libraries ship prebuilt binaries, so none is needed
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node scripts/render.mjs --only-changed

      - name: Generate calendar (.ics) feeds
        if: github.event_name == 'push' || steps.update.outputs.written != '0'
        run: node scripts/ics.mjs

      - name: Publish Mini App and data (GitHub Pages)
        if: github.event_name == 'push' || steps.update.outputs.written != '0'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs

      - name: Deploy GitHub Pages
        if: github.event_name == 'push' || steps.update.outputs.written != '0'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Send change alerts
        if: github.event_name != 'push' && steps.update.outputs.changed != '0'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/notify.mjs changes

      - name: Send weekly timetable (manual force)
        if: github.event_name == 'workflow_dispatch' && inputs.weekly
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/notify.mjs weekly

      - name: Send weekly/tomorrow reminders when due
        if: github.event_name != 'push'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/notify.mjs auto

      - name: Send admin announcement
        if: github.event_name == 'workflow_dispatch' && inputs.announce != ''
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          ANNOUNCE_TEXT: ${{ inputs.announce }}
        run: node scripts/notify.mjs announce

      - name: Show subscriber stats
        if: github.event_name == 'workflow_dispatch' && inputs.stats
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: node scripts/stats.mjs

      - name: Keep the pictures for the next run
        # last, so uploading ~400 MB never holds up the deploy or the messages
        if: steps.render.outcome == 'success' && steps.render.outputs.rendered != '0'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: docs/img
          key: img-${{ hashFiles('scripts/render.mjs', 'src/shared.mjs', 'docs/data/subjects.json', 'docs/icon-192.png', 'fonts/**', 'package-lock.json') }}-${{ github.run_id }}
