# Only needed if you deploy with the command line (npx wrangler deploy).
# The no-code setup in README.md uses the Cloudflare dashboard instead.
name = "tsue-timetable-bot"
main = "worker/worker.mjs"
compatibility_date = "2025-09-01"

[vars]
SITE_URL = "https://YOUR-GITHUB-NAME.github.io/tsue-timetable-bot"

[[d1_databases]]
binding = "DB"
database_name = "tsue-bot"
database_id = "PUT-YOUR-D1-DATABASE-ID-HERE"
