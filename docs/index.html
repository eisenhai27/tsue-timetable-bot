<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TDIU Jadval</title>
<meta name="description" content="TDIU Jadval — dars jadvali, tez qidiruv, o'qituvchilar, xonalar va bo'sh xonalar.">
<meta name="theme-color" content="#0B3F7A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TDIU Jadval">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
/* TDIU Jadval — brand: navy #0B3F7A, blue #2A7BDB, lightning yellow #FFC83D (from the logo) */
:root{
  --navy:#0B3F7A; --blue:#2A7BDB; --bolt:#FFC83D;
  --bg:#F2F5FA; --card:#FFFFFF; --text:#10233F; --hint:#6B7A90; --line:#E3E9F2;
  --soft:#E7F0FD; --link:#1F63B8;
  --lec:#2A7BDB; --lec-bg:#E7F0FD; --sem:#1F9D55; --sem-bg:#E4F5EC; --lab:#E07B00; --lab-bg:#FFF1E0; --oth:#7C8AA0; --oth-bg:#EEF1F6;
  --warn:#C2410C; --warn-bg:#FFF3E6; --good:#1F9D55; --good-bg:#E4F5EC;
  --r:18px; --shadow:0 1px 2px rgba(16,35,63,.06),0 6px 18px rgba(16,35,63,.06);
}
html.dark{
  --bg:#0A1424; --card:#122036; --text:#EAF1FB; --hint:#8EA0BA; --line:#1E3150; --soft:#16325A; --link:#7FB3F5;
  --lec-bg:#15345C; --sem-bg:#123B2A; --lab-bg:#3B2A12; --oth-bg:#1B2A40; --warn-bg:#3A2413; --good-bg:#123B2A;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Manrope,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
.hidden{display:none!important}
.muted{color:var(--hint)} .small{font-size:13px}

/* ---- signature header: navy band with calendar rings, like the logo */
.hero{position:relative;margin:0 -14px;padding:22px 16px 18px;background:var(--navy);color:#fff;border-radius:0 0 26px 26px;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;top:-40px;right:-60px;width:220px;height:260px;background:var(--blue);opacity:.28;transform:skewX(-18deg)}
.hero::after{right:-150px;opacity:.22}
.rings{position:absolute;top:-2px;left:26px;display:flex;gap:30px}
.rings i{display:block;width:10px;height:18px;border-radius:0 0 8px 8px;background:#fff;opacity:.9}
.hrow{position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none}
.mark img{width:40px;height:40px}
.htitle{flex:1;min-width:0;text-align:left}
.htitle .t1{font-weight:800;font-size:22px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle .t1 small{font-size:14px;opacity:.7;margin-left:4px}
.htitle .t2{font-size:13px;color:#A9C8F2;font-weight:600;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;line-height:1.3}
.star{font-size:24px;padding:6px;color:#A9C8F2}
.star.on{color:var(--bolt)}
.summary{position:relative;z-index:1;margin-top:14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.summary .bolt{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.progress{position:relative;z-index:1;margin-top:10px;height:6px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden}
.progress b{display:block;height:100%;background:var(--bolt);border-radius:6px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}

/* ---- week strip */
.weekbar{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px;gap:8px}
.weekbar .lbl{font-weight:800;font-size:17px;min-width:0;line-height:1.25}
.weekbar .lbl .muted{display:block;font-size:12.5px;font-weight:700}
.pill{background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}
.pill.on{background:var(--navy);color:#fff}
html.dark .pill.on{background:var(--blue)}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{position:relative;background:var(--card);border-radius:14px;padding:8px 0 10px;text-align:center;box-shadow:var(--shadow)}
.day .dn{font-size:11px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.04em}
.day .dd{font-weight:800;font-size:19px}
.day.today .dd{color:var(--blue)}
.day.sel{background:var(--navy);color:#fff}
html.dark .day.sel{background:var(--blue)}
.day.sel .dn{color:#A9C8F2} .day.sel .dd{color:#fff}
.day .dot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:3px;background:var(--line)}
.day.sel .dot{background:var(--bolt)}
.calbtn{display:inline-flex;align-items:center;gap:6px}
.calbtn .chev{display:inline-block;transition:transform .25s ease}
.calbtn .chev.up{transform:rotate(180deg)}
.cal{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1),opacity .25s ease,transform .32s cubic-bezier(.2,.8,.2,1),margin .32s;margin:0}
.cal.open{grid-template-rows:1fr;opacity:1;transform:none;margin:0 0 12px}
.cal-in{overflow:hidden;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.cal.open .cal-in{padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-weight:800;font-size:15px}
.cal-nav{width:34px;height:34px;border-radius:10px;background:var(--bg);font-size:20px;font-weight:800;color:var(--navy)}
html.dark .cal-nav{color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid i{font-style:normal;font-size:11px;font-weight:800;color:var(--hint);text-transform:uppercase;padding:4px 0}
.cd{position:relative;height:38px;border-radius:11px;font-weight:700;font-size:14px}
.cd.has::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--blue)}
.cd.off{color:var(--hint);opacity:.45}
.cd.today{color:var(--blue);box-shadow:inset 0 0 0 2px var(--soft)}
.cd.sel{background:var(--navy);color:#fff}
html.dark .cd.sel{background:var(--blue)}
.cd.sel::after{background:var(--bolt)}
.in-right{animation:inR .28s cubic-bezier(.2,.8,.2,1)}
.in-left{animation:inL .28s cubic-bezier(.2,.8,.2,1)}
.in-fade{animation:inF .28s ease}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inF{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.day{transition:background .2s ease,transform .15s ease}
.day:active{transform:scale(.94)}
.day .chg{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--warn)}

/* ---- change banner */
.banner{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;margin:12px 0;font-size:14px}
.banner b{color:var(--warn)}
.banner summary{cursor:pointer;list-style:none;font-weight:700}
.banner summary::-webkit-details-marker{display:none}
.banner .diff{margin-top:8px;font-size:13px}
.banner .diff div{padding:3px 0}
.banner .rm{text-decoration:line-through;color:var(--hint)}

/* ---- lesson cards (same look as the weekly picture) */
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.lesson{position:relative;display:flex;gap:14px;background:var(--card);border-radius:var(--r);padding:14px 14px 14px 18px;box-shadow:var(--shadow);overflow:hidden}
.lesson::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--bar,var(--oth))}
.lesson.t-lecture{--bar:var(--lec)} .lesson.t-seminar{--bar:var(--sem)} .lesson.t-lab,.lesson.t-practice{--bar:var(--lab)}
.lesson .time{flex:none;width:54px}
.lesson .time .a{font-weight:800;font-size:18px;letter-spacing:-.01em}
.lesson .time .b{font-size:13px;color:var(--hint);font-weight:600}
.lesson .time .n{margin-top:6px;display:inline-block;font-size:11px;font-weight:800;color:var(--hint);background:var(--bg);border-radius:6px;padding:1px 6px}
.lesson .body{flex:1;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.tag{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--bar,var(--oth))}
.tag.wk{color:var(--hint)} .tag.new{color:#fff;background:var(--warn);border-radius:6px;padding:0 6px}
.lesson .subj{font-weight:800;font-size:16px;line-height:1.3}
.orig{font-weight:500;opacity:.62;font-size:.88em}
.meta{display:flex;flex-direction:column;gap:3px;margin-top:8px;font-size:13.5px;font-weight:600}
.meta .ln{display:flex;gap:6px;align-items:baseline;color:var(--hint);text-align:left}
.meta .ln span{color:var(--text)}
.meta button.ln span{color:var(--link)}
.lesson.now{box-shadow:0 0 0 2px var(--blue),var(--shadow)}
.lesson.past{opacity:.5}
.state{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px;margin-bottom:6px;background:var(--bolt);color:#3B2A00}
.state.next{background:var(--soft);color:var(--link)}
.gap{font-size:12px;color:var(--hint);text-align:center;font-weight:600}
.empty{text-align:center;padding:44px 10px;color:var(--hint);font-weight:600}
.empty .big{font-size:44px}
.actions{display:flex;gap:8px;margin-top:14px}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border-radius:14px;padding:12px;font-weight:800;font-size:14px;box-shadow:var(--shadow);color:var(--navy)}
html.dark .act{color:#fff}

/* ---- search */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;outline:0;background:transparent;padding:13px 0;font-size:16px;min-width:0;font-weight:600}
.hero .search{margin-top:14px;position:relative;z-index:1;box-shadow:none;color:var(--text)}
.seg{display:flex;gap:6px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.sec{margin:18px 2px 8px;font-size:12px;font-weight:800;color:var(--hint);text-transform:uppercase;letter-spacing:.06em}
.rows{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ri{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--soft);flex:none;font-size:16px}
.row .rt{flex:1;min-width:0}
.row .rt div:first-child{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rs{font-size:12px;color:var(--hint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--hint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.gbtn{background:var(--card);border-radius:12px;padding:11px 6px;text-align:center;font-weight:800;font-size:14px;box-shadow:var(--shadow)}
mark{background:var(--bolt);color:#10233F;border-radius:4px;padding:0 1px}

/* ---- free rooms */
.slotbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px 0}
.slotbar::-webkit-scrollbar{display:none}
.slotbar .pill{flex:none}
.bld h4{margin:14px 2px 8px;font-size:12px;font-weight:800;color:var(--hint);text-transform:uppercase;letter-spacing:.06em}
.rooms{display:flex;flex-wrap:wrap;gap:6px}
.room{display:flex;flex-direction:column;align-items:flex-start;background:var(--good-bg);color:var(--good);border-radius:12px;padding:7px 11px;font-weight:800;font-size:13px;line-height:1.25}
.room small{font-size:11px;font-weight:700;opacity:.75}
.pill.now{color:var(--navy)} .pill.now.on{background:var(--bolt);color:#3B2A00}
html.dark .pill.now{color:var(--bolt)} html.dark .pill.now.on{color:#3B2A00}

/* ---- bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{position:relative;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--hint)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--navy)}
html.dark .nav button.on{color:#fff}
.nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--bolt)}

/* ---- sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(6,18,36,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;animation:up .18s ease-out;max-height:88vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-size:19px;font-weight:800}
.sheet .kv{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center;font-weight:600}
.sheet .kv:last-child{border-bottom:0}
.sheet .kv .k{width:26px;text-align:center}
.sheet .kv .v{flex:1}
.sheet .kv button{color:var(--link);text-align:left;font-weight:700}
.sheet img{width:100%;border-radius:14px;display:block}
.foot{margin:22px 2px 8px;font-size:12px;color:var(--hint);text-align:center;font-weight:600;line-height:1.6}
.foot b{color:var(--navy)} .foot a.author{color:var(--link);font-weight:800;text-decoration:none} html.dark .foot b{color:#A9C8F2}
.sig{display:inline-flex;align-items:center;gap:6px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s .8s linear infinite;margin:40px auto}
@keyframes s{to{transform:rotate(360deg)}}
/* ---- v2: language button, role cards, view switch, week view, chips */
.hero{padding-top:calc(22px + env(safe-area-inset-top))}
html.tg .rings{top:-2px}
button.mark{border:0}
button.htitle{display:block;color:inherit;text-align:left;font:inherit}
.langbtn{flex:none;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:6px 10px;font-weight:800;font-size:12.5px;letter-spacing:.02em;white-space:nowrap}
.langbtn:active{background:rgba(255,255,255,.26)}
.hero .star{padding:6px 2px}
.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 2px 0}
.pillrow .pill{font-size:13px}
.vm{display:flex;margin:14px 0 0;padding:4px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);gap:4px}
.vm button{flex:1;padding:9px 6px;border-radius:11px;font-weight:800;font-size:14px;color:var(--hint);transition:background .2s,color .2s}
.vm button.on{background:var(--navy);color:#fff}
html.dark .vm button.on{background:var(--blue)}
.who{margin:22px 0 4px}
.who h2{margin:0 2px 12px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.rolecard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .12s}
.rolecard:active{transform:scale(.985)}
.rolecard .re{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:27px;flex:none}
.rolecard .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rolecard .rt b{font-size:18px;font-weight:800}
.rolecard .rt small{font-size:13.5px;color:var(--hint);font-weight:600}
.rolecard .chev{font-size:26px;color:var(--hint)}
.lets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px 0 10px;padding-bottom:2px}
.lets::-webkit-scrollbar{display:none}
.lets .pill{flex:none;min-width:38px;text-align:center}
.meta button.ln{width:100%;text-align:left;padding:0}
.meta .ln.grp{align-items:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);color:var(--link);border-radius:9px;padding:3px 9px;font-weight:800;font-size:12.5px}
.chip:active{opacity:.7}
.list.wk{gap:6px;margin-top:10px}
.dayh{display:flex;align-items:baseline;gap:8px;margin:14px 2px 2px;font-size:15px}
.dayh b{font-weight:800}
.dayh span{color:var(--hint);font-weight:700;font-size:13px}
.dayh em{margin-left:auto;font-style:normal;color:var(--hint);font-weight:700;font-size:12px}
.dayh.today b{color:var(--blue)}
.dayh.today::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bolt);align-self:center}
.noday{padding:2px 4px 4px;color:var(--hint);font-size:13px;font-weight:600;opacity:.8}
.ml{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:10px 12px 10px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ml::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--oth)}
.ml.t-lecture::before{background:var(--lec)} .ml.t-seminar::before{background:var(--sem)} .ml.t-lab::before,.ml.t-practice::before{background:var(--lab)}
.ml .mt{flex:none;width:44px;display:flex;flex-direction:column;line-height:1.2}
.ml .mt b{font-weight:800;font-size:15px}
.ml .mt small{font-size:12px;color:var(--hint);font-weight:600}
.ml .mb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ml .ms{font-weight:800;font-size:14.5px;line-height:1.3}
.ml .mk{display:flex;flex-wrap:wrap;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--bar,var(--oth))}
.ml.t-lecture{--bar:var(--lec)} .ml.t-seminar{--bar:var(--sem)} .ml.t-lab,.ml.t-practice{--bar:var(--lab)}
.ml .mk .wk{color:var(--hint)}
.ml .mk .new{color:#fff;background:var(--warn);border-radius:5px;padding:0 5px}
.ml .mm{font-size:12.5px;color:var(--hint);font-weight:600;word-break:break-word}
.picmiss{margin-top:10px;text-align:center}
.langopt{display:flex;width:100%;text-align:left;font-size:16px}
.langopt.on .v{color:var(--blue);font-weight:800}
.sheet{max-height:88vh;max-height:88dvh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-bg{touch-action:none}
.sheet .chips{margin:2px 0}
html,body{overscroll-behavior-y:none}
.lesson{cursor:pointer;text-align:left}
.lesson:focus-visible,.ml:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---- v3: richer header, room pills, live dot, skeletons, 4-tab bar */
.hero{background:linear-gradient(135deg,#0B3F7A 0%,#0F4C93 55%,#1E67BD 130%)}
html.dark .hero{background:linear-gradient(135deg,#0B3463 0%,#0E4283 60%,#18559F 130%)}
.nowline{position:relative;z-index:1;margin-top:10px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.12);font-weight:700;font-size:13.5px;line-height:1.3;text-align:left}
.nowline b{font-weight:800;white-space:nowrap}
.nowline span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2BD576;position:relative;flex:none;vertical-align:middle;margin-right:2px}

function search(q, filter) {
  const nq = norm(q), nqt = normT(q);
  if (!nq && !nqt) return [];
  const words = String(q).toUpperCase().split(/\s+/).map(norm).filter(Boolean);
  const out = [];
  for (const e of ALL) {
    if (filter !== 'all' && filter !== e.type) continue;
    let score;
    if (e.n === nq || (nqt && e.nt === nqt)) score = 0;
    else if (e.n.startsWith(nq) || (nqt && e.nt.startsWith(nqt))) score = 1;
    else if (e.n.includes(nq) || (nqt && e.nt.includes(nqt))) score = 2;
    else if (words.length > 1 && words.every(w => e.n.includes(w))) score = 3;
    else {
      // "901" should find "MO-901/26": compare against digits-only too
      const digits = e.n.replace(/[^0-9]/g, '');
      if (/^\d+$/.test(nq) && digits.includes(nq)) score = 4; else continue;
    }
    out.push([score + (e.type === 'g' ? 0 : 0.5), e]);
  }
  out.sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name, undefined, { numeric: true }));

}

function highlight(name, q) {

  const map = []; let n = '';

  if (at < 0) return esc(name);
  const a = map[at], b = map[at + nq.length - 1] + 1;

    <button class="langbtn" id="langBtn" aria-label="language">🌐 ${lang.toUpperCase()}</button>
    ${v && !isMine(v) ? `<button class="star ${fav ? 'on' : ''}" id="favBtn" aria-label="favorite">${fav ? '★' : '☆'}</button>` : ''}</div>${extra || ''}</div>`;
}
function footHtml(label) {
  return `<div class="foot">${label ? esc(L.validity) + ': ' + esc(label) + '<br>' : ''}<span class="sig">⚡ <b>TDIU Jadval</b> · @tdiujadval_bot</span><br>${esc(L.madeBy)} <a class="author" href="https://t.me/Eisenhai" target="_blank" rel="noopener">@Eisenhai</a></div>`;
}
function bindHero() {
  const go = () => { haptic(); S.stack.push(snap()); S.tab = 'search'; S.picking = null; render(); };
  const a = $('#goSearch'), b = $('#goSearch2'), f = $('#favBtn'), lb = $('#langBtn');
  if (a) a.onclick = go; if (b) b.onclick = go;
  if (lb) lb.onclick = langSheet;

    store.set('favs', S.favs);

  };
}

const key = (l) => [l.d, l.p, l.w || '', l.g || '', l.s, l.t, l.r, l.n].join('|');
function timeOf(l) {
  const a = INDEX.periods.find(p => p.p === l.p);
  const b = INDEX.periods.find(p => p.p === l.p + (l.n || 1) - 1) || a;
  return { a: a ? a.start : '', b: b ? b.end : '' };
}
/** "8-310-30" → "8-bino, 310-xona" */
function roomLabel(r) {
  const m = /^(\d{1,2})\s*[-/]+\s*(\d{2,4}[A-Za-zА-Яа-я]?)(?:\s*-\s*\d+)?$/.exec(String(r).trim());
  return m ? `${L.bld(m[1])}, ${L.roomW(m[2])}` : r;
}
const splitList = (s) => String(s || '').split(', ').map(x => x.trim()).filter(Boolean);
const chipBtn = (code, label, cls = '') => `<button class="chip ${cls}" data-open="${esc(code)}">${esc(label)}</button>`;

function lessonHtml(l, t, cls, state, v, isNew, par) {
  const st = splitType(l.s);
  const tags = [];
  if (st.type) tags.push(`<span class="tag">${esc(st.type)}</span>`);
  if (l.w && !par) tags.push(`<span class="tag wk">${l.w === 'A' ? esc(L.weekA) : esc(L.weekB)}</span>`);
  if (l.g) tags.push(`<span class="tag wk">${esc(l.g)}</span>`);
  if (isNew) tags.push(`<span class="tag new">${esc(L.new)}</span>`);
  const meta = [];
  if (v.type !== 'r') {
    if (l.r) for (const r of splitList(l.r)) meta.push(`<button class="ln rm" data-open="r:${esc(r)}">📍 <span>${esc(roomLabel(r))}</span></button>`);
    else meta.push(`<div class="ln">📍 <span class="muted">${esc(L.noRoom)}</span></div>`);
  }
  if (v.type !== 't' && l.t) for (const t2 of splitList(l.t)) meta.push(`<button class="ln" data-open="t:${esc(t2)}">👤 <span>${esc(t2)}</span></button>`);
  if (l.gr) { // which groups attend — tappable chips (the teacher's own timetable is mostly about these)
    const gs = splitList(l.gr);
    meta.push(`<div class="ln grp">👥 <div class="chips">${gs.map(g => chipBtn('g:' + g, g)).join('')}</div></div>`);
  }
  return `<div class="lesson t-${st.cls} ${cls}" role="button" tabindex="0">
    <div class="time"><div class="a">${esc(t.a)}</div><div class="b">${esc(t.b)}</div><div class="n">${l.p} ${esc(L.pairShort)}</div></div>
    <div class="body">${state ? `<div>${state}</div>` : ''}${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}<div class="subj">${nameHtml(st)}</div>
    <div class="meta">${meta.join('')}</div></div></div>`;
}
/** compact row of the week view */
function miniHtml(l, v, par, k, isNew) {
  const st = splitType(l.s), t = timeOf(l);
  const bits = [];
  if (v.type !== 'r' && l.r) bits.push('📍 ' + esc(splitList(l.r).map(roomLabel).join(' / ')));
  if (v.type !== 't' && l.t) bits.push('👤 ' + esc(l.t));
  if (l.gr) bits.push('👥 ' + esc(splitList(l.gr).join(', ')));
  const tags = [];
  if (st.type) tags.push(`<span>${esc(st.type)}</span>`);
  if (l.w && !par) tags.push(`<span class="wk">${l.w === 'A' ? esc(L.weekA) : esc(L.weekB)}</span>`);
  if (l.g) tags.push(`<span class="wk">${esc(l.g)}</span>`);
  if (isNew) tags.push(`<span class="new">${esc(L.new)}</span>`);
  return `<button class="ml t-${st.cls}" data-k="${k}"><span class="mt"><b>${esc(t.a)}</b><small>${esc(t.b)}</small></span>
    <span class="mb">${tags.length ? `<span class="mk">${tags.join('')}</span>` : ''}<span class="ms">${nameHtml(st)}</span>
    <span class="mm">${bits.join(' · ')}</span></span></button>`;
}

const renderTimetable = safe(async function () {
  const my = ++seq;
  const v = S.view;
  const soft = S.soft; S.soft = false;
  const scrollY = soft ? window.scrollY : 0;
  const path = fileOf(v);
  if (!soft && !peek(path)) { app.innerHTML = `<div class="wrap">${heroHtml(v, '', '')}<div class="sk h1"></div><div class="sk h2"></div><div class="sk h2"></div><div class="sk h2"></div></div>`; bindHero(); }
  let data;
  try { data = await swr(path, () => { if (S.tab === 'tt' && S.view && fileOf(S.view) === path) softRender(); }); } catch (e) {
    if (my !== seq) return;
    if (String(e.message) === '404') { app.innerHTML = `<div class="wrap">${heroHtml(v, '', '')}<div class="empty">${esc(L.nothing)}</div></div>`; bindHero(); return; }
    throw e;
  }
  if (v.type !== 'g') await ensurePeople(); else ensurePeople();
  if (my !== seq) return;

  const now = nowT();
  const nm = now.getUTCHours() * 60 + now.getUTCMinutes();
  const baseMon = monday(wd(now) === 6 ? addD(now, 1) : now);
  const mon = addD(baseMon, S.weekOffset * 7);
  const par = parity(INDEX.weekA, mon);
  const lessonsOf = (d) => (data.lessons || []).filter(l => l.d === d && (!par || !l.w || l.w === par));
  if (S.day == null) {
    // opens on today; once today's classes are over (or there are none) it opens on the next day that has classes
    S.day = 0;
    if (S.weekOffset === 0 && wd(now) < 6) {
      S.day = wd(now);
      const t0 = lessonsOf(S.day);
      if (!t0.length || Math.max(...t0.map(l => mins(timeOf(l).b))) <= nm) for (let d = S.day + 1; d < 6; d++) if (lessonsOf(d).length) { S.day = d; break; }
    }
  }

  // subtitle: a group → faculty · course; a teacher → how much he teaches this week
  let sub;
  if (v.type === 'g') sub = facName(data.fac || '') + (data.course ? ' · ' + courseName(data.course) : '');
  else if (v.type === 't') {
    const gs = new Set(); let n = 0;
    for (let d = 0; d < 6; d++) for (const l of lessonsOf(d)) { n++; splitList(l.gr).forEach(g => gs.add(g)); }
    sub = '👨‍🏫 ' + L.teacherSub(gs.size, n);
  } else sub = L.room;

  // recently changed lessons — shown for 1 day, or until the user has opened this view once,
  // whichever comes first (store a per-entity "seen" marker so it doesn't come back on next visit)
  const seenKey = `seen:${v.type}:${v.id}`;
  const seenAt = store.get(seenKey, null);
  const recentChanges = (data.changes || []).filter(c => Date.now() - Date.parse(c.at) < DAY && (!seenAt || Date.parse(c.at) > Date.parse(seenAt)));
  if (recentChanges.length) store.set(seenKey, recentChanges[0].at);
  const newKeys = new Set();
  const changedDays = new Set();
  for (const c of recentChanges) for (const dd of c.days) { changedDays.add(dd.d); for (const l of dd.added) newKeys.add(key(l)); }

  // "Today" summary with a progress bar through the school day — the signature strip under the title
  let summary = '';
  if (wd(now) < 6) {
    const pn = parity(INDEX.weekA, now);
    const todays = (data.lessons || []).filter(l => l.d === wd(now) && (!pn || !l.w || l.w === pn));
    if (todays.length) {
      const start = mins(timeOf(todays[0]).a), end = Math.max(...todays.map(l => mins(timeOf(l).b)));
      const endS = `${String(Math.floor(end / 60)).padStart(2, '0')}:${String(end % 60).padStart(2, '0')}`;
      const pct = Math.max(0, Math.min(100, Math.round((nm - start) / (end - start) * 100)));
      summary = `<div class="summary"><span class="bolt">⚡</span><span>${esc(L.todayL)}: ${esc(L.lessonsN(todays.length))} · ${nm >= end ? esc(L.done) : esc(L.until(endS))}</span></div><div class="progress"><b style="width:${pct}%"></b></div>${nowLine(data, v, now)}`;
    } else summary = `<div class="summary"><span class="bolt">☀️</span><span>${esc(L.dayOff)}</span></div>`;
  }

  let banner = '';
  if (recentChanges.length) {
    const c = recentChanges[0];
    const when = new Date(Date.parse(c.at) + TZ);
    const whenS = `${dm(when)} ${String(when.getUTCHours()).padStart(2, '0')}:${String(when.getUTCMinutes()).padStart(2, '0')}`;
    const lines = [];
    for (const dd of c.days) {
      for (const l of dd.removed) lines.push(`<div class="rm">➖ ${esc(L.dShort[dd.d])} ${esc(timeOf(l).a)} ${nameHtml(splitType(l.s))}${l.r ? ' · ' + esc(l.r) : ''}${l.gr ? ' · ' + esc(l.gr) : ''}</div>`);
      for (const l of dd.added) lines.push(`<div>➕ ${esc(L.dShort[dd.d])} ${esc(timeOf(l).a)} ${nameHtml(splitType(l.s))}${l.r ? ' · ' + esc(l.r) : ''}${l.gr ? ' · ' + esc(l.gr) : ''}</div>`);
    }
    banner = `<div class="banner"><details><summary>⚠️ <b>${esc(c.newTT ? L.newTT : L.changed)}</b> · <span class="muted small">${esc(L.changedAt(whenS))}</span> ▾</summary><div class="diff">${lines.slice(0, 30).join('')}</div></details></div>`;
  }

  // who is this? (your own / somebody else's) → shortcuts back to "mine"
  let mineBar = '';
  if (!isMine(v)) {
    if (S.mine) mineBar += `<button class="pill" id="goMine">← ${esc(L.backMine)}</button>`;
    if (v.type !== 'r') mineBar += `<button class="pill" id="makeMine">📌 ${esc(L.makeMine)}</button>`;
  }
  const mineRow = mineBar ? `<div class="pillrow">${mineBar}</div>` : '';

  const week = S.vm === 'week';
  const date = addD(mon, S.day);
  const parLbl = par ? (par === 'A' ? L.weekA : L.weekB) : '';
  const flat = []; // lessons in the order they are drawn (the click handlers map back to them)
  let body = '';
  if (week) {
    const parts = [];
    for (let d = 0; d < 6; d++) {
      const dt = addD(mon, d), ls = lessonsOf(d), isT = sameDay(dt, now);
      parts.push(`<div class="dayh ${isT ? 'today' : ''}"><b>${esc(L.days[d])}</b><span>${esc(fmtDate(dt))}</span>${ls.length ? `<em>${esc(L.lessonsN(ls.length))}</em>` : ''}</div>`);
      if (!ls.length) parts.push(`<div class="noday">${esc(L.noDay)}</div>`);
      for (const l of ls) { flat.push(l); parts.push(miniHtml(l, v, par, flat.length - 1, newKeys.has(key(l)) && S.weekOffset === 0)); }
    }
    body = parts.join('');
  } else {
    const list = lessonsOf(S.day);
    if (!list.length) body = `<div class="empty"><div class="big">🎉</div>${esc(L.noLessons)}</div>`;
    else {
      const isToday = sameDay(date, now);
      let nextMarked = false, prevEnd = null;
      body = list.map(l => {
        const t = timeOf(l);
        let cls = '', state = '';
        if (isToday) {
          const a = mins(t.a), b = mins(t.b);
          if (nm >= a && nm < b) { cls = 'now'; state = `<span class="state"><i class="pulse"></i>${esc(L.now)} · ${esc(L.left(b - nm))}</span>`; }
          else if (nm >= b) cls = 'past';
          else if (!nextMarked) { nextMarked = true; state = `<span class="state next">${esc(L.next)} · ${esc(L.inMin(a - nm))}</span>`; }
        }
        let gap = '';
        if (prevEnd != null) { const g = mins(t.a) - prevEnd; if (g >= 30) gap = `<div class="gap">☕ ${esc(L.breakMin(g))}</div>`; }
        prevEnd = mins(t.b);
        flat.push(l);
        return gap + lessonHtml(l, t, cls, state, v, newKeys.has(key(l)) && S.weekOffset === 0, par);
      }).join('');
    }
  }

  const dayBtns = [0, 1, 2, 3, 4, 5].map(d => {
    const dt = addD(mon, d);
    const has = lessonsOf(d).length;
    return `<button class="day ${d === S.day ? 'sel' : ''} ${sameDay(dt, now) ? 'today' : ''}" data-d="${d}">
      <div class="dn">${L.dShort[d]}</div><div class="dd">${dt.getUTCDate()}</div>
      ${has ? `<span class="dots">${'<i></i>'.repeat(Math.min(has, 4))}</span>` : ''}${changedDays.has(d) && S.weekOffset === 0 ? '<span class="chg"></span>' : ''}</button>`;
  }).join('');

  const calBtn = `<button class="pill calbtn ${S.calOpen ? 'on' : ''}" id="calBtn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M8 3v4M16 3v4M3 10h18"/></svg> ${esc(L.months[date.getUTCMonth()])} <span class="chev ${S.calOpen ? 'up' : ''}">▾</span></button>`;
  const wkLabel = S.weekOffset === 0 ? L.thisWeek : S.weekOffset === 1 ? L.nextWeek : `${dm(mon)} – ${dm(addD(mon, 5))}`;
  const bar = week
    ? `<div class="weekbar"><div class="lbl">${esc(dm(mon))} – ${esc(dm(addD(mon, 5)))}<span class="muted small">${esc(parLbl)}</span></div>
        <div style="display:flex;gap:6px"><button class="pill" id="wPrev" aria-label="prev">‹</button><span class="pill on">${esc(wkLabel)}</span><button class="pill" id="wNext" aria-label="next">›</button></div></div>`
    : `<div class="weekbar"><div class="lbl">${esc(L.days[S.day])}, ${esc(fmtDate(date))}<span class="muted small">${esc(parLbl)}</span></div>
        <div style="display:flex;gap:6px">${sameDay(date, now) ? '' : `<button class="pill" id="goToday">↺ ${esc(L.goToday)}</button>`}${calBtn}</div></div>
      <div class="cal ${S.calOpen ? 'open' : ''}" id="cal"><div class="cal-in" id="calIn"></div></div>
      <div class="days">${dayBtns}</div>`;

  const vm = `<div class="vm" role="tablist"><button class="${week ? '' : 'on'}" data-vm="day">📅 ${esc(L.vDay)}</button><button class="${week ? 'on' : ''}" data-vm="week">🗓 ${esc(L.vWeek)}</button></div>`;
  const pic = (v.type !== 'r' && lang === 'uz') ? `<button class="act" id="weekPic">🖼 ${esc(L.weekPic)}</button>` : '';
  const shr = v.type !== 'r' ? `<button class="act" id="shareBtn">↗ ${esc(L.share)}</button>` : '';
  const actions = (pic || shr) ? `<div class="actions">${pic}${shr}</div>` : '';

  app.innerHTML = `<div class="wrap">
    ${heroHtml(v, sub, S.weekOffset === 0 ? summary : '')}
    ${mineRow}${vm}
    ${bar}
    ${banner}
    <div class="list ${week ? 'wk' : ''} ${S.anim || (soft ? '' : 'stag')}" id="list">${body}</div>
    ${actions}
    ${footHtml(validityText(data.tt))}
  </div>`;
  bindHero();
  S.anim = '';
  if (soft) window.scrollTo(0, scrollY);

  const gm = $('#goMine'); if (gm) gm.onclick = () => { haptic(); S.view = S.mine; S.stack = []; S.day = null; S.weekOffset = 0; render(); };
  const mm = $('#makeMine'); if (mm) mm.onclick = () => { haptic('medium'); setMine(v); S.stack = []; render(); };
  app.querySelectorAll('[data-vm]').forEach(b => b.onclick = () => { haptic(); S.vm = b.dataset.vm; store.set('vm', S.vm); S.calOpen = false; S.anim = 'in-fade'; renderTimetable(); });
  app.querySelectorAll('.day').forEach(b => b.onclick = () => { haptic(); const nd = Number(b.dataset.d); S.anim = nd > S.day ? 'in-right' : nd < S.day ? 'in-left' : ''; S.day = nd; renderTimetable(); });

  // ---- calendar dropdown (animated), today button, swipe between days
  const goDate = (dt, dir) => {
    S.weekOffset = Math.round((monday(dt) - baseMon) / (7 * DAY));
    S.day = Math.min(5, wd(dt));
    S.anim = dir > 0 ? 'in-right' : dir < 0 ? 'in-left' : 'in-fade';
    renderTimetable();
  };
  if (week) {
    const jump = (k) => { haptic(); S.weekOffset += k; S.anim = k > 0 ? 'in-right' : 'in-left'; renderTimetable(); };
    $('#wPrev').onclick = () => jump(-1); $('#wNext').onclick = () => jump(1);
  } else {
    const todayBtn = $('#goToday');
    if (todayBtn) todayBtn.onclick = () => { haptic(); S.calOpen = false; S.calMonth = null; goDate(wd(now) === 6 ? addD(now, 1) : now, date < now ? 1 : -1); };
    const calIn = $('#calIn');
    if (!S.calMonth) S.calMonth = { y: date.getUTCFullYear(), m: date.getUTCMonth() };
    const drawCal = (slide) => {
      const { y, m } = S.calMonth;
      const first = new Date(Date.UTC(y, m, 1));
      const daysIn = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
      const lead = wd(first);
      const cells = [];
      for (let i = 0; i < lead; i++) cells.push('<span></span>');
      for (let dd = 1; dd <= daysIn; dd++) {
        const dt = new Date(Date.UTC(y, m, dd));
        const w = wd(dt);
        const pr = parity(INDEX.weekA, dt);
        const has = w < 6 && (data.lessons || []).some(l => l.d === w && (!pr || !l.w || l.w === pr));
        const cls = [w === 6 ? 'off' : '', sameDay(dt, now) ? 'today' : '', sameDay(dt, date) ? 'sel' : '', has ? 'has' : ''].join(' ');
        cells.push(`<button class="cd ${cls}" data-cd="${dd}" ${w === 6 ? 'disabled' : ''}>${dd}</button>`);
      }
      calIn.innerHTML = `<div class="cal-head"><button class="cal-nav" data-cm="-1" aria-label="prev">‹</button><b>${esc(L.months[m])} ${y}</b><button class="cal-nav" data-cm="1" aria-label="next">›</button></div>
        <div class="cal-grid ${slide || ''}">${L.dShort.map(x => `<i>${esc(x)}</i>`).join('')}${cells.join('')}</div>`;
      calIn.querySelectorAll('[data-cm]').forEach(b => b.onclick = () => {
        haptic(); const k = Number(b.dataset.cm); let nm2 = S.calMonth.m + k, ny = S.calMonth.y;
        if (nm2 < 0) { nm2 = 11; ny--; } if (nm2 > 11) { nm2 = 0; ny++; }
        S.calMonth = { y: ny, m: nm2 }; drawCal(k > 0 ? 'in-right' : 'in-left');
      });
      calIn.querySelectorAll('[data-cd]').forEach(b => b.onclick = () => {
        haptic('medium');
        const dt = new Date(Date.UTC(S.calMonth.y, S.calMonth.m, Number(b.dataset.cd)));
        S.calOpen = false; S.calMonth = null;
        goDate(dt, dt > date ? 1 : dt < date ? -1 : 0);
      });
    };
    drawCal('');
    $('#calBtn').onclick = () => {
      haptic();
      S.calOpen = !S.calOpen;
      if (S.calOpen) { S.calMonth = { y: date.getUTCFullYear(), m: date.getUTCMonth() }; drawCal(''); }
      $('#cal').classList.toggle('open', S.calOpen);
      $('#calBtn').classList.toggle('on', S.calOpen);
      $('#calBtn .chev').classList.toggle('up', S.calOpen);
    };
  }
  // swipe left/right on the lessons: day view → previous/next day, week view → previous/next week
  const lst = $('#list');
  let sx = null, sy = null;
  lst.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  lst.addEventListener('touchend', (e) => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    haptic();
    if (week) { S.weekOffset += dx < 0 ? 1 : -1; S.anim = dx < 0 ? 'in-right' : 'in-left'; renderTimetable(); return; }
    let dt = addD(date, dx < 0 ? 1 : -1);
    if (wd(dt) === 6) dt = addD(dt, dx < 0 ? 1 : -1);
    goDate(dt, dx < 0 ? 1 : -1);
  }, { passive: true });

  // tap on a room / teacher / group chip → that timetable; tap on the card → details
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = (ev) => { ev.stopPropagation(); const e = entityOf(b.dataset.open); if (e) openEntity(e); });
  const onCard = (el, i) => { el.onclick = () => showLesson(flat[i], v, par); el.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); showLesson(flat[i], v, par); } }; };
  if (week) app.querySelectorAll('.ml').forEach(el => onCard(el, Number(el.dataset.k)));
  else app.querySelectorAll('.lesson').forEach((el, i) => onCard(el, i));

  const wp = $('#weekPic');
  if (wp) wp.onclick = () => {
    haptic();

/** Current (or next) pair: {day, p, mode:'now'|'next'} — used by the "⚡ Hozir" button */
function currentSlot() {
  const now = nowT();
  const nm = now.getUTCHours() * 60 + now.getUTCMinutes();
  const d = wd(now);
  const P = INDEX.periods;
  if (d === 6) return { day: 0, p: P[0].p, mode: 'next' };
  const cur = P.find(x => nm >= mins(x.start) && nm < mins(x.end));
  if (cur) return { day: d, p: cur.p, mode: 'now' };
  const nxt = P.find(x => nm < mins(x.start));
  if (nxt) return { day: d, p: nxt.p, mode: 'next' };
  return { day: d === 5 ? 0 : d + 1, p: P[0].p, mode: 'next' };
}

// ---------------------------------------------------------------- "Where is the teacher?"
// JS twin of whereIs() / dayItems() in src/shared.mjs (the bot answers with the very same rules; tests compare the two).
const hhmm = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const dayStart = (d) => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
const roomShort = (r) => { const m = /^(\d{1,2})\s*[-/]+\s*(\d{2,4}[A-Za-zА-Яа-я]?)(?:\s*-\s*\d+)?$/.exec(String(r).trim()); return m ? `${m[1]}-${m[2]}` : String(r).trim(); };
function spanOf(l) {
  const P = INDEX.periods, a = P.find(p => p.p === l.p), b = P.find(p => p.p === l.p + (l.n || 1) - 1) || a;
  return a ? { from: mins(a.start), to: mins(b.end) } : { from: 0, to: 0 };
}
function dayItems(ent, date) {
  const d = wd(date);
  if (d === 6) return [];
  const pr = parity(INDEX.weekA, date);
  return (ent.lessons || []).filter(l => l.d === d && (!pr || !l.w || l.w === pr)).map(l => ({ l, ...spanOf(l) })).sort((x, y) => x.from - y.from || x.l.p - y.l.p);
}
function whereIs(ent, now) {
  const nowM = now.getUTCHours() * 60 + now.getUTCMinutes();
  const today = dayItems(ent, now);
  const cur = today.filter(x => nowM >= x.from && nowM < x.to);
  const later = today.filter(x => x.from > nowM);
  const done = today.some(x => x.to <= nowM);
  let next = null;
  if (later.length) next = { date: now, today: true, items: later.filter(x => x.from === later[0].from) };
  else for (let k = 1; k <= 14 && !next; k++) {
    const date = addD(now, k), items = dayItems(ent, date);
    if (items.length) next = { date, today: false, items: items.filter(x => x.from === items[0].from) };
  }
  const state = cur.length ? 'now' : !today.length ? 'off' : later.length ? (done ? 'between' : 'before') : 'after';
  const until = cur.length ? Math.max(...cur.map(x => x.to)) : null;
  return { state, nowM, today, cur, next, until, left: until == null ? null : until - nowM, inMin: next && next.today ? next.items[0].from - nowM : null };
}
window.__tt = { whereIs, dayItems, nowT, parity, get INDEX() { return INDEX; } }; // read-only handle for the tests

/** The line under the header: what is happening now / next today (for any timetable). */
function nowLine(ent, v, now) {
  const st = whereIs(ent, now);
  let x, tag, tail;
  if (st.state === 'now') { x = st.cur[0]; tag = `<i class="pulse"></i><b>${esc(L.whInline.now)}</b>`; tail = L.until(hhmm(st.until)); }
  else if (st.next && st.next.today) { x = st.next.items[0]; tag = `<b>⏭ ${esc(L.whInline.next)}</b>`; tail = hhmm(x.from); }
  else return '';
  const room = v.type !== 'r' && x.l.r ? splitList(x.l.r).map(roomShort).join(' / ') : '';
  return `<div class="nowline">${tag}<span>${esc(splitType(x.l.s).name)}${room ? ' · 📍 ' + esc(room) : ''} · ${esc(tail)}</span></div>`;
}

/** Short live status of a teacher for list rows: {cls, t}. */
function statusShort(ent, now) {
  const st = whereIs(ent, now), h = L.whShort;
  const roomOf = (x) => x.l.r ? splitList(x.l.r).map(roomShort).join('/') : '—';
  if (st.state === 'now') return { cls: 'live', t: h.now(roomOf(st.cur[0]), hhmm(st.until)) };
  if (st.next && st.next.today) return { cls: 'soon', t: h.next(roomOf(st.next.items[0]), hhmm(st.next.items[0].from)) };
  if (st.next) return { cls: '', t: h.nextDay(sameDay(st.next.date, addD(now, 1)) ? L.whTomorrow : L.dShort[wd(st.next.date)], hhmm(st.next.items[0].from)) };
  return { cls: '', t: h.off };
}

  S.stack.push(snap());
  S.wt = { type: 't', id: e.id, name: e.name }; S.wDate = null;
  S.wRecent = [S.wt, ...S.wRecent.filter(x => x.id !== e.id)].slice(0, 8);
  store.set('wrecent', S.wRecent);
  S.tab = 'where';
  render();
  window.scrollTo(0, 0);
}

function whereHome() {
  seq++;
  app.innerHTML = `<div class="wrap"><div class="hero"><div class="rings"><i></i><i></i></div>
      <div class="hrow"><span class="mark"><img src="icon-192.png" alt=""></span><div class="htitle"><div class="t1">${esc(L.whereT)}</div><div class="t2">${esc(L.whereSub)}</div></div>
      <button class="langbtn" id="langBtn" aria-label="language">🌐 ${lang.toUpperCase()}</button></div>
      <label class="search">🔎<input id="wq" type="search" autocomplete="off" enterkeyhint="search" placeholder="${esc(L.teacherPh)}" value="${esc(S.wq)}"></label></div>
    <div id="wres"></div>${footHtml('')}</div>`;
  $('#langBtn').onclick = langSheet;
  const inp = $('#wq');
  inp.oninput = () => { S.wq = inp.value; drawWhereList(); };
  drawWhereList();
  if (S.wq || !((S.own && S.own.length) || S.favs.some(f => f.type === 't') || S.wRecent.length)) setTimeout(() => { if (document.activeElement !== inp && $('#wq') === inp) inp.focus(); }, 60);
}
function drawWhereList() {
  const res = $('#wres'); if (!res) return;
  const bind = () => {
    res.querySelectorAll('[data-wid]').forEach(b => b.onclick = () => {
      const e = wEntity(b.dataset.wid) || S.favs.concat(S.wRecent).find(x => x.id === b.dataset.wid);
      if (e) openWhere(e);
    });
    fillStatuses(res);
  };
  const ownBy = new Map((S.own || []).map(o => [o.e.id, o]));
  if (S.wq.trim()) {
    const hits = search(S.wq, 't');
    if (ownBy.size) hits.sort((a, b) => (ownBy.has(b.id) ? 1 : 0) - (ownBy.has(a.id) ? 1 : 0)); // stable: my own teachers first, rest keep their relevance order
    res.innerHTML = hits.length ? `<div class="rows" style="margin-top:12px">${hits.map(e => wRow(e, S.wq, ownBy.has(e.id) ? subjLine(ownBy.get(e.id)) : '')).join('')}</div>` : `<div class="empty"><div class="big">🤷</div>${esc(L.nothing)}</div>`;
    bind(); return;
  }
  const favT = S.favs.filter(f => f.type === 't' && !ownBy.has(f.id));
  const recT = S.wRecent.filter(r => !favT.some(f => f.id === r.id) && !ownBy.has(r.id));
  let h = '';
  if (ownBy.size) h += `<div class="sec">🎓 ${esc(L.myTeachers)} · ${esc(S.mine.name)}</div><div class="rows">${[...ownBy.values()].map(o => wRow(o.e, '', subjLine(o))).join('')}</div>`;
  if (favT.length) h += `<div class="sec">⭐ ${esc(L.favs)}</div><div class="rows">${favT.map(e => wRow(e, '')).join('')}</div>`;
  if (recT.length) h += `<div class="sec">🕘 ${esc(L.recent)}</div><div class="rows">${recT.map(e => wRow(e, '')).join('')}</div>`;
  if (!ownBy.size && !favT.length && !recT.length) h += `<div class="wtips"><b>${esc(L.whEmpty)}</b>${L.whTips.map((t, i) => `<div><i>${['🚪', '⏭', '🗓'][i]}</i>${esc(t)}</div>`).join('')}</div>`;
  // A–Z list of all teachers (no live status here — tap one to see it)
  const list = (PEOPLE ? PEOPLE.teachers : []).filter(([, n]) => realName(n));
  const letter = (n) => (normT(n).charAt(0) || '#');
  const letters = [...new Set(list.map(([, n]) => letter(n)))].sort();
  if (!S.wLetter || !letters.includes(S.wLetter)) S.wLetter = letters[0];
  if (letters.length) {
    h += `<div class="sec">${esc(L.teachers)} · ${esc(L.whAZ)}</div><div class="lets">${letters.map(c => `<button class="pill ${c === S.wLetter ? 'on' : ''}" data-wlet="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
    const rows = list.filter(([, n]) => letter(n) === S.wLetter).sort((a, b) => a[1].localeCompare(b[1]));
    h += `<div class="rows">${rows.map(([id, name]) => `<button class="row" data-wid="${esc(id)}"><span class="ri">👤</span><span class="rt"><div>${esc(name)}</div><div class="rs">${esc(L.teacher)}</div></span><span class="chev">›</span></button>`).join('')}</div>`;
  }
  res.innerHTML = h;
  res.querySelectorAll('[data-wlet]').forEach(b => b.onclick = () => { haptic(); S.wLetter = b.dataset.wlet; drawWhereList(); });
  bind();
}

const dayWord = (date, now) => sameDay(date, addD(now, 1)) ? L.whTomorrow : `${L.days[wd(date)]}, ${fmtDate(date)}`;
const roomBtn = (l) => {
  const rs = l.r ? splitList(l.r) : [];
  if (!rs.length) return `<span class="wroom none">📍 ${esc(L.whNoRoom)}</span>`;
  return rs.map(r => { const m = roomLabel(r).split(', '); return `<button class="wroom" data-open="r:${esc(r)}">📍 <span>${esc(m[1] || m[0])}${m[1] ? `<small>${esc(m[0])}</small>` : ''}</span></button>`; }).join('');
};
const itemBig = (x) => {
  const st = splitType(x.l.s);
  return `<div class="wmain">${roomBtn(x.l)}<div class="wsubj">${nameHtml(st)}<small>${esc([st.type, x.l.g].filter(Boolean).join(' · '))}</small></div>${x.l.gr ? `<div class="chips">${splitList(x.l.gr).map(g => chipBtn('g:' + g, g)).join('')}</div>` : ''}</div>`;
};
function tliHtml(x, cls, par) {
  const st = splitType(x.l.s), rs = x.l.r ? splitList(x.l.r) : [];
  const tag = x.l.w && !par ? (x.l.w === 'A' ? L.weekA : L.weekB) : '';
  return `<div class="tli t-${st.cls} ${cls}"><div class="tt"><b>${hhmm(x.from)}</b><small>${hhmm(x.to)}</small></div><div class="tb">
    <div class="ts">${nameHtml(st)}${st.type || tag || x.l.g ? `<small>${esc([st.type, tag, x.l.g].filter(Boolean).join(' · '))}</small>` : ''}</div>
    ${rs.length ? rs.map(r => `<button class="rpill" data-open="r:${esc(r)}">📍 ${esc(roomLabel(r))}</button>`).join('') : `<span class="rpill none">📍 ${esc(L.whNoRoom)}</span>`}
    ${x.l.gr ? `<div class="chips">${splitList(x.l.gr).map(g => chipBtn('g:' + g, g)).join('')}</div>` : ''}</div></div>`;
}

async function whereCard(my, soft, y) {
  const t = S.wt, path = `t/${t.id}.json`;
  if (!soft && !peek(path)) app.innerHTML = `<div class="wrap"><div class="hero"><div class="rings"><i></i><i></i></div><div class="hrow"><span class="mark"><img src="icon-192.png" alt=""></span><div class="htitle"><div class="t1">${esc(t.name)}</div><div class="t2">${esc(L.whLoading)}</div></div></div></div><div class="sk h2"></div><div class="sk h2"></div><div class="sk row"></div></div>`;
  let ent;
  try { ent = await swr(path, () => { if (S.tab === 'where' && S.wt && S.wt.id === t.id) softRender(); }); }
  catch (e) { if (String(e.message) !== '404') throw e; ent = { id: t.id, name: t.name, lessons: [] }; }
  if (my !== seq) return;
  const now = nowT();
  const st = whereIs(ent, now);
  if (!S.wDate) S.wDate = dayStart((st.state === 'off' || st.state === 'after') && st.next ? st.next.date : now);
  if (wd(S.wDate) === 6) S.wDate = addD(S.wDate, 1);
  const date = S.wDate, mon = monday(date), par = parity(INDEX.weekA, date);
  const fav = S.favs.some(f => f.type === 't' && f.id === t.id);
  const label = { now: L.whNow, between: L.whBetween, before: L.whBefore, after: L.whAfter, off: L.whOff }[st.state];

  let main = '';
  if (st.state === 'now') {
    main = st.cur.map(itemBig).join('');
    const c0 = st.cur[0], pct = Math.max(2, Math.min(100, Math.round((st.nowM - c0.from) / Math.max(1, c0.to - c0.from) * 100)));
    main += `<div class="wprog"><b style="width:${pct}%"></b></div><div class="wleft">⏱ ${esc(L.until(hhmm(st.until)))} · ${esc(L.left(st.left))}</div>`;
  } else if (st.next) {
    const n = st.next, t0 = hhmm(n.items[0].from);
    main = `<div class="wwhen">⏭ ${esc(L.whNext)} — ${esc(n.today ? `${t0} · ${L.inMin(st.inMin)}` : `${dayWord(n.date, now)}, ${t0}`)}</div>${n.items.map(itemBig).join('')}`;
  }
  let after = '';
  if (st.state === 'now' && st.next) {
    const n = st.next, t0 = hhmm(n.items[0].from);
    after = `<div class="sec">⏭ ${esc(L.whNext)} · ${esc(n.today ? t0 : `${dayWord(n.date, now)}, ${t0}`)}</div><div class="tl">${n.items.map(x => tliHtml(x, '', parity(INDEX.weekA, n.date))).join('')}</div>`;
  }

  const items = dayItems(ent, date), isToday = sameDay(date, now);
  const nmv = st.nowM;
  let prevEnd = null;
  const tl = items.map(x => {
    const gap = prevEnd != null && x.from - prevEnd >= 30 ? `<div class="gap">☕ ${esc(L.breakMin(x.from - prevEnd))}</div>` : '';
    prevEnd = Math.max(prevEnd ?? 0, x.to);
    const cls = isToday ? (nmv >= x.from && nmv < x.to ? 'now' : x.to <= nmv ? 'past' : '') : '';
    return gap + tliHtml(x, cls, par);
  }).join('');
  const dayBtns = [0, 1, 2, 3, 4, 5].map(d => {
    const dt = addD(mon, d), n = dayItems(ent, dt).length;
    return `<button class="day ${sameDay(dt, date) ? 'sel' : ''} ${sameDay(dt, now) ? 'today' : ''}" data-wd="${d}"><div class="dn">${L.dShort[d]}</div><div class="dd">${dt.getUTCDate()}</div>${n ? `<span class="dots">${'<i></i>'.repeat(Math.min(n, 4))}</span>` : ''}</button>`;
  }).join('');
  const parLbl = par ? (par === 'A' ? L.weekA : L.weekB) : '';

  app.innerHTML = `<div class="wrap">
    <div class="hero"><div class="rings"><i></i><i></i></div>
      <div class="hrow"><button class="mark" id="wBack" aria-label="back"><img src="icon-192.png" alt=""></button>
      <div class="htitle" style="cursor:default"><div class="t1">${esc(t.name)}</div><div class="t2">👨‍🏫 ${esc(L.whereT)}</div></div>
      <button class="langbtn" id="langBtn" aria-label="language">🌐 ${lang.toUpperCase()}</button>
      <button class="star ${fav ? 'on' : ''}" id="wFav" aria-label="favorite">${fav ? '★' : '☆'}</button></div></div>
    <div class="wcard st-${st.state}"><div class="wst">${st.state === 'now' ? '<i class="pulse"></i>' : ''}${esc(label)}</div>${main}</div>
    ${after}
    <div class="wwk"><div class="lbl">${esc(L.whPlan)}<span>${esc(dm(mon))} – ${esc(dm(addD(mon, 5)))}${parLbl ? ' · ' + esc(parLbl) : ''}</span></div>
      <div style="display:flex;gap:6px"><button class="pill" id="wPrev" aria-label="${esc(L.prevWk)}">‹</button><button class="pill" id="wNext" aria-label="${esc(L.nextWk)}">›</button></div></div>
    <div class="wdays">${dayBtns}</div>
    <div class="tl" id="wtl">${tl || `<div class="empty" style="padding:26px 10px"><div class="big">🎉</div>${esc(L.noLessons)}</div>`}</div>
    <div class="wactions"><button class="act" id="wFull">📅 ${esc(L.whFull)}</button><button class="act" id="wShare">↗ ${esc(L.share)}</button></div>
    <div class="wnote">ℹ️ ${esc(L.whNote)}</div>
    ${footHtml('')}</div>`;
  if (soft) window.scrollTo(0, y);

  $('#langBtn').onclick = langSheet;
  $('#wBack').onclick = () => { haptic(); if (S.stack.length) goBack(); else { S.wt = null; S.wDate = null; render(); } };
  $('#wFav').onclick = () => {
    haptic('medium');
    const i = S.favs.findIndex(x => x.type === 't' && x.id === t.id);
    if (i >= 0) S.favs.splice(i, 1); else S.favs.unshift({ type: 't', id: t.id, name: t.name });
    store.set('favs', S.favs);
    $('#wFav').classList.toggle('on', i < 0); $('#wFav').textContent = i < 0 ? '★' : '☆';
  };
  const redraw = () => { S.soft = true; renderWhere(); };
  app.querySelectorAll('[data-wd]').forEach(b => b.onclick = () => { haptic(); S.wDate = addD(mon, Number(b.dataset.wd)); redraw(); });
  $('#wPrev').onclick = () => { haptic(); S.wDate = addD(date, -7); redraw(); };
  $('#wNext').onclick = () => { haptic(); S.wDate = addD(date, 7); redraw(); };
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = (ev) => { ev.stopPropagation(); const e = entityOf(b.dataset.open); if (e) openEntity(e); });
  $('#wFull').onclick = () => { const e = wEntity(t.id) || { type: 't', id: t.id, name: t.name }; openEntity(e); };
  $('#wShare').onclick = () => {
    haptic();
    const url = `https://t.me/tdiujadval_bot?start=w_${t.id}`;
    const link = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(`${t.name} — ${L.whereT}`)}`;
    if (inTg && tg.openTelegramLink) tg.openTelegramLink(link); else window.open(link, '_blank');
  };
}

const renderWhere = safe(async function () {
  const my = ++seq;
  const soft = S.soft; S.soft = false;
  const y = soft ? window.scrollY : 0;
  if (!PEOPLE && !soft && !(S.wt && peek(`t/${S.wt.id}.json`)) && !peek('people.json')) app.innerHTML = `<div class="wrap"><div class="sk h1" style="height:120px;border-radius:0 0 26px 26px;margin:0 -14px"></div><div class="sk row"></div><div class="sk row"></div><div class="sk row"></div></div>`;
  await ensurePeople();
  if (my !== seq) return;
  if (S.wt) return await whereCard(my, soft, y);
  S.own = await ownTeachers();
  if (my !== seq) return;
  if (soft && $('#wres')) { fillStatuses($('#wres')); return; } // home: only the live chips change
  whereHome();
});

/** Re-draw the current screen without a spinner (data refreshed in the background, or the minute ticked over). */
function softRender() {
  if (document.hidden || sheetOpen() || S.picking || S.onboard) return;
  if (S.tab === 'tt' && S.view) { S.soft = true; renderTimetable(); }
  else if (S.tab === 'where') { S.soft = true; renderWhere(); }
}
setInterval(softRender, 60e3);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const p = S.tab === 'where' && S.wt ? `t/${S.wt.id}.json` : S.tab === 'tt' && S.view ? fileOf(S.view) : null;
  if (p) swr(p, softRender);
  softRender();
});

// Author link: inside Telegram open the profile natively instead of a browser page
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a.author');
  if (!a) return;
  if (inTg && tg.openTelegramLink) { e.preventDefault(); haptic(); tg.openTelegramLink(a.href); }
});

// ---------------------------------------------------------------- start
if (!inTg && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch {} }
(async () => {
  // everything a launch needs starts downloading right now, in parallel (index, and the user's own timetable if we know it)
  load('index.json').catch(() => {});
  if (S.mine) load(fileOf(S.mine)).catch(() => {});

  // Telegram CloudStorage keeps the user's own timetable, favourites and language across his devices.
  // Known user (own timetable already on this device) → never wait for it; first launch on this device → wait up to 0.8 s.
  const cloud = new Promise(res => {
    if (!(inTg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'))) return res();
    try {
      tg.CloudStorage.getItems(['mine', 'favs', 'recent', 'wrecent', 'lang', 'botLang', 'vm'], (err, v) => {
        try {
          if (!err && v) {
            if (v.mine && !S.mine) S.mine = JSON.parse(v.mine);
            if (v.favs && !S.favs.length) S.favs = JSON.parse(v.favs);
            if (v.recent && !S.recent.length) S.recent = JSON.parse(v.recent);
            if (v.wrecent && !S.wRecent.length) S.wRecent = JSON.parse(v.wrecent);
            if (v.vm && store.get('vm', null) == null) S.vm = JSON.parse(v.vm);
            try { if (v.lang && store.get('lang', null) == null) localStorage.setItem('tt_lang', v.lang); } catch {}
            try { if (v.botLang && store.get('botLang', null) == null) localStorage.setItem('tt_botLang', v.botLang); } catch {}
          }
        } catch {}
        res();
      });
    } catch { res(); }
    setTimeout(res, 800);
  });
  if (!S.mine) await cloud;
  decideLang();
  if (hash.get('tab') === 'free') S.tab = 'free';
  else if (hash.get('tab') === 'where') S.tab = 'where';
  const wid = hash.get('w');
  if (wid) { // a link to "where is this teacher?" — opens the card, and does NOT make him "my timetable"
    try {
      await ensureIndex(); await ensurePeople();
      const e = wEntity(wid);
      if (e) { S.tab = 'where'; S.wt = { type: 't', id: e.id, name: e.name }; S.wRecent = [S.wt, ...S.wRecent.filter(x => x.id !== e.id)].slice(0, 8); store.set('wrecent', S.wRecent); }
    } catch {}
  }
  const gid = hash.get('g') || hash.get('t') || hash.get('r');
  if (gid) {
    try {
      await ensureIndex();
      const type = hash.get('g') ? 'g' : hash.get('t') ? 't' : 'r';
      if (type !== 'g') await ensurePeople();
      const e = ALL.find(x => x.type === type && x.id === gid);
      if (e) {
        // a link from the bot (#g= for students, #t= for teachers) is the user's own timetable
        if (type === 'g' || type === 't') setMine(e);
        S.view = { type, id: e.id, name: e.name }; remember(e);
      }
    } catch {}
  }
  render();
  // the teachers / rooms list is needed by search, the Teacher tab and the tappable chips: fetch it while the screen is idle
  (window.requestIdleCallback || ((f) => setTimeout(f, 1200)))(() => { ensurePeople().catch(() => {}); });
})();
})();
</script>
</body>
