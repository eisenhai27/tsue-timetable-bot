<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TDIU Jadval</title>
<meta name="description" content="TDIU Jadval — dars jadvali, tez qidiruv, o'qituvchilar, xonalar va bo'sh xonalar.">
<meta name="theme-color" content="#0B3F7A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* TDIU Jadval — brand: navy #0B3F7A, blue #2A7BDB, lightning yellow #FFC83D (from the logo) */
:root{
  --navy:#0B3F7A; --blue:#2A7BDB; --bolt:#FFC83D;
  --bg:#F2F5FA; --card:#FFFFFF; --text:#10233F; --hint:#6B7A90; --line:#E3E9F2;
  --soft:#E7F0FD; --link:#1F63B8;
  --lec:#2A7BDB; --lec-bg:#E7F0FD; --sem:#1F9D55; --sem-bg:#E4F5EC; --lab:#E07B00; --lab-bg:#FFF1E0; --oth:#7C8AA0; --oth-bg:#EEF1F6;
  --warn:#C2410C; --warn-bg:#FFF3E6; --good:#1F9D55; --good-bg:#E4F5EC;
  --r:18px; --shadow:0 1px 2px rgba(16,35,63,.06),0 6px 18px rgba(16,35,63,.06);
}
html.dark{
  --bg:#0A1424; --card:#122036; --text:#EAF1FB; --hint:#8EA0BA; --line:#1E3150; --soft:#16325A; --link:#7FB3F5;
  --lec-bg:#15345C; --sem-bg:#123B2A; --lab-bg:#3B2A12; --oth-bg:#1B2A40; --warn-bg:#3A2413; --good-bg:#123B2A;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Manrope,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
.hidden{display:none!important}
.muted{color:var(--hint)} .small{font-size:13px}

/* ---- signature header: navy band with calendar rings, like the logo */
.hero{position:relative;margin:0 -14px;padding:22px 16px 18px;background:var(--navy);color:#fff;border-radius:0 0 26px 26px;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;top:-40px;right:-60px;width:220px;height:260px;background:var(--blue);opacity:.28;transform:skewX(-18deg)}
.hero::after{right:-150px;opacity:.22}
.rings{position:absolute;top:-2px;left:26px;display:flex;gap:30px}
.rings i{display:block;width:10px;height:18px;border-radius:0 0 8px 8px;background:#fff;opacity:.9}
.hrow{position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none}
.mark img{width:40px;height:40px}
.htitle{flex:1;min-width:0;text-align:left}
.htitle .t1{font-weight:800;font-size:22px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle .t1 small{font-size:14px;opacity:.7;margin-left:4px}
.htitle .t2{font-size:13px;color:#A9C8F2;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{font-size:24px;padding:6px;color:#A9C8F2}
.star.on{color:var(--bolt)}
.summary{position:relative;z-index:1;margin-top:14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.summary .bolt{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.progress{position:relative;z-index:1;margin-top:10px;height:6px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden}
.progress b{display:block;height:100%;background:var(--bolt);border-radius:6px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}

/* ---- week strip */
.weekbar{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px;gap:8px}
.weekbar .lbl{font-weight:800;font-size:17px}
.pill{background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}
.pill.on{background:var(--navy);color:#fff}
html.dark .pill.on{background:var(--blue)}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{position:relative;background:var(--card);border-radius:14px;padding:8px 0 10px;text-align:center;box-shadow:var(--shadow)}
.day .dn{font-size:11px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.04em}
.day .dd{font-weight:800;font-size:19px}
.day.today .dd{color:var(--blue)}
.day.sel{background:var(--navy);color:#fff}
html.dark .day.sel{background:var(--blue)}
.day.sel .dn{color:#A9C8F2} .day.sel .dd{color:#fff}
.day .dot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:3px;background:var(--line)}
.day.sel .dot{background:var(--bolt)}
.day .chg{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--warn)}

/* ---- change banner */
.banner{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;margin:12px 0;font-size:14px}
.banner b{color:var(--warn)}
.banner summary{cursor:pointer;list-style:none;font-weight:700}
.banner summary::-webkit-details-marker{display:none}
.banner .diff{margin-top:8px;font-size:13px}
.banner .diff div{padding:3px 0}
.banner .rm{text-decoration:line-through;color:var(--hint)}

/* ---- lesson cards (same look as the weekly picture) */
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.lesson{position:relative;display:flex;gap:14px;background:var(--card);border-radius:var(--r);padding:14px 14px 14px 18px;box-shadow:var(--shadow);overflow:hidden}
.lesson::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--bar,var(--oth))}
.lesson.t-lecture{--bar:var(--lec)} .lesson.t-seminar{--bar:var(--sem)} .lesson.t-lab,.lesson.t-practice{--bar:var(--lab)}
.lesson .time{flex:none;width:54px}
.lesson .time .a{font-weight:800;font-size:18px;letter-spacing:-.01em}
.lesson .time .b{font-size:13px;color:var(--hint);font-weight:600}
.lesson .time .n{margin-top:6px;display:inline-block;font-size:11px;font-weight:800;color:var(--hint);background:var(--bg);border-radius:6px;padding:1px 6px}
.lesson .body{flex:1;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.tag{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--bar,var(--oth))}
.tag.wk{color:var(--hint)} .tag.new{color:#fff;background:var(--warn);border-radius:6px;padding:0 6px}
.lesson .subj{font-weight:800;font-size:16px;line-height:1.3}
.meta{display:flex;flex-direction:column;gap:3px;margin-top:8px;font-size:13.5px;font-weight:600}
.meta .ln{display:flex;gap:6px;align-items:baseline;color:var(--hint);text-align:left}
.meta .ln span{color:var(--text)}
.meta button.ln span{color:var(--link)}
.lesson.now{box-shadow:0 0 0 2px var(--blue),var(--shadow)}
.lesson.past{opacity:.5}
.state{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px;margin-bottom:6px;background:var(--bolt);color:#3B2A00}
.state.next{background:var(--soft);color:var(--link)}
.gap{font-size:12px;color:var(--hint);text-align:center;font-weight:600}
.empty{text-align:center;padding:44px 10px;color:var(--hint);font-weight:600}
.empty .big{font-size:44px}
.actions{display:flex;gap:8px;margin-top:14px}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border-radius:14px;padding:12px;font-weight:800;font-size:14px;box-shadow:var(--shadow);color:var(--navy)}
html.dark .act{color:#fff}

/* ---- search */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;outline:0;background:transparent;padding:13px 0;font-size:16px;min-width:0;font-weight:600}
.hero .search{margin-top:14px;position:relative;z-index:1;box-shadow:none;color:var(--text)}
.seg{display:flex;gap:6px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.sec{margin:18px 2px 8px;font-size:12px;font-weight:800;color:var(--hint);text-transform:uppercase;letter-spacing:.06em}
.rows{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ri{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--soft);flex:none;font-size:16px}
.row .rt{flex:1;min-width:0}
.row .rt div:first-child{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rs{font-size:12px;color:var(--hint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--hint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.gbtn{background:var(--card);border-radius:12px;padding:11px 6px;text-align:center;font-weight:800;font-size:14px;box-shadow:var(--shadow)}
mark{background:var(--bolt);color:#10233F;border-radius:4px;padding:0 1px}

/* ---- free rooms */
.slotbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px 0}
.slotbar::-webkit-scrollbar{display:none}
.slotbar .pill{flex:none}
.bld h4{margin:14px 2px 8px;font-size:12px;font-weight:800;color:var(--hint);text-transform:uppercase;letter-spacing:.06em}
.rooms{display:flex;flex-wrap:wrap;gap:6px}
.room{background:var(--good-bg);color:var(--good);border-radius:10px;padding:7px 11px;font-weight:800;font-size:13px}

/* ---- bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{position:relative;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--hint)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--navy)}
html.dark .nav button.on{color:#fff}
.nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--bolt)}

/* ---- sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(6,18,36,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;animation:up .18s ease-out;max-height:88vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-size:19px;font-weight:800}
.sheet .kv{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center;font-weight:600}
.sheet .kv:last-child{border-bottom:0}
.sheet .kv .k{width:26px;text-align:center}
.sheet .kv .v{flex:1}
.sheet .kv button{color:var(--link);text-align:left;font-weight:700}
.sheet img{width:100%;border-radius:14px;display:block}
.foot{margin:22px 2px 8px;font-size:12px;color:var(--hint);text-align:center;font-weight:600;line-height:1.6}
.foot b{color:var(--navy)} html.dark .foot b{color:#A9C8F2}
.sig{display:inline-flex;align-items:center;gap:6px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s .8s linear infinite;margin:40px auto}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav"><div class="wrap">
  <button data-tab="tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3M13 14h3M8 17h3"/></svg><span data-t="navTT"></span></button>
  <button data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span data-t="navSearch"></span></button>
  <button data-tab="free"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16M6 21V4a1 1 0 0 1 1-1h8l3 3v15"/><circle cx="14" cy="13" r="1" fill="currentColor"/></svg><span data-t="navFree"></span></button>
</div></nav>
<div id="sheet"></div>

<script>
(() => {
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (inTg) { document.documentElement.classList.add('tg'); tg.ready(); tg.expand(); try { tg.setHeaderColor('#0B3F7A'); tg.setBackgroundColor(tg.colorScheme === 'dark' ? '#0A1424' : '#F2F5FA'); } catch {} }
const isDark = inTg ? tg.colorScheme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
if (isDark) document.documentElement.classList.add('dark');

// ---------------------------------------------------------------- i18n
const dur = (m, h, mi) => m >= 60 ? `${Math.floor(m / 60)} ${h}${m % 60 ? ' ' + (m % 60) + ' ' + mi : ''}` : `${m} ${mi}`;
const I = {
  uz: { days:['Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba','Yakshanba'], dShort:['Du','Se','Ch','Pa','Ju','Sh','Ya'],
    navTT:'Jadval', navSearch:'Qidiruv', navFree:"Bo'sh xonalar", bld:(b)=>`${b}-bino`, roomW:(r)=>`${r}-xona`, lessonsN:(n)=>`${n} ta dars`, until:(t)=>`${t} gacha`, dayOff:"Bugun dars yo'q — dam oling", weekPic:'Haftalik rasm', share:'Ulashish', madeBy:'muallif', todayL:'Bugun', pairShort:'para', done:'Darslar tugadi', thisWeek:'Shu hafta', nextWeek:'Keyingi hafta', weekA:'A hafta', weekB:'B hafta',
    now:'Hozir', next:'Keyingi', noLessons:"Bu kuni dars yo'q", sunday:'Yakshanba — dam olish kuni 😌', searchPh:'Guruh, o\'qituvchi yoki xona…',
    all:'Hammasi', groups:'Guruhlar', teachers:"O'qituvchilar", rooms:'Xonalar', recent:"So'nggi", favs:'Sevimlilar', browse:"Fakultet bo'yicha",
    pick:'Guruhingizni tanlang', pickSub:'Qidiruvga guruh nomini yozing, masalan 901', nothing:'Hech narsa topilmadi', changed:"Jadval o'zgardi",
    changedAt:(d)=>`${d} da yangilandi`, show:'Batafsil', newTT:"Yangi jadval e'lon qilindi", lecture:"Ma'ruza", seminar:'Seminar', lab:'Laboratoriya', practice:'Amaliy',
    free:"Bo'sh xonalar", freeFor:(d,p)=>`${d}, ${p}-juftlik`, freeCount:(n)=>`${n} ta bo'sh xona`, filterRoom:'Xona raqami…', teacher:"O'qituvchi", room:'Xona', groupsL:'Guruhlar',
    time:'Vaqt', week:'Hafta', open:'Ochish', course:(n)=>n?`${n}-kurs`:'Boshqa', validity:'Amal qiladi', lang:'Til', breakMin:(m)=>`tanaffus ${m} daq`, error:"Ma'lumotni yuklab bo'lmadi. Internetni tekshirib qayta urinib ko'ring.", retry:'Qayta urinish', new:'Yangi', inMin:(m)=>`${dur(m,'soat','daq')} dan so'ng`, left:(m)=>`${m} daq qoldi` },
  ru: { days:['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'], dShort:['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],
    navTT:'Расписание', navSearch:'Поиск', navFree:'Свободные', bld:(b)=>`корпус ${b}`, roomW:(r)=>`ауд. ${r}`, lessonsN:(n)=>`${n} пар(ы)`, until:(t)=>`до ${t}`, dayOff:'Сегодня пар нет — отдыхайте', weekPic:'Картинка недели', share:'Поделиться', madeBy:'автор', todayL:'Сегодня', pairShort:'пара', done:'Пары закончились', thisWeek:'Эта неделя', nextWeek:'Следующая', weekA:'Неделя A', weekB:'Неделя B',
    now:'Сейчас', next:'Далее', noLessons:'В этот день пар нет', sunday:'Воскресенье — выходной 😌', searchPh:'Группа, преподаватель или аудитория…',
    all:'Все', groups:'Группы', teachers:'Преподаватели', rooms:'Аудитории', recent:'Недавние', favs:'Избранное', browse:'По факультетам',
    pick:'Выберите группу', pickSub:'Введите название группы, например 901', nothing:'Ничего не найдено', changed:'Расписание изменилось',
    changedAt:(d)=>`обновлено ${d}`, show:'Подробнее', newTT:'Опубликовано новое расписание', lecture:'Лекция', seminar:'Семинар', lab:'Лаб.', practice:'Практика',
    free:'Свободные аудитории', freeFor:(d,p)=>`${d}, ${p} пара`, freeCount:(n)=>`${n} свободных`, filterRoom:'Номер аудитории…', teacher:'Преподаватель', room:'Аудитория', groupsL:'Группы',
    time:'Время', week:'Неделя', open:'Открыть', course:(n)=>n?`${n} курс`:'Другое', validity:'Действует', lang:'Язык', breakMin:(m)=>`перерыв ${m} мин`, error:'Не удалось загрузить данные. Проверьте интернет и попробуйте ещё раз.', retry:'Повторить', new:'Новое', inMin:(m)=>`через ${dur(m,'ч','мин')}`, left:(m)=>`осталось ${m} мин` },
  en: { days:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'], dShort:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
    navTT:'Timetable', navSearch:'Search', navFree:'Free rooms', bld:(b)=>`Building ${b}`, roomW:(r)=>`Room ${r}`, lessonsN:(n)=>`${n} classes`, until:(t)=>`until ${t}`, dayOff:'No classes today — enjoy', weekPic:'Week picture', share:'Share', madeBy:'by', todayL:'Today', pairShort:'per.', done:'Classes are over', thisWeek:'This week', nextWeek:'Next week', weekA:'Week A', weekB:'Week B',
    now:'Now', next:'Next', noLessons:'No classes this day', sunday:'Sunday — day off 😌', searchPh:'Group, teacher or room…',
    all:'All', groups:'Groups', teachers:'Teachers', rooms:'Rooms', recent:'Recent', favs:'Favorites', browse:'By faculty',
    pick:'Pick your group', pickSub:'Type your group name, e.g. 901', nothing:'Nothing found', changed:'Timetable changed',
    changedAt:(d)=>`updated ${d}`, show:'Details', newTT:'New timetable published', lecture:'Lecture', seminar:'Seminar', lab:'Lab', practice:'Practice',
    free:'Free rooms', freeFor:(d,p)=>`${d}, pair ${p}`, freeCount:(n)=>`${n} free rooms`, filterRoom:'Room number…', teacher:'Teacher', room:'Room', groupsL:'Groups',
    time:'Time', week:'Week', open:'Open', course:(n)=>n?`Year ${n}`:'Other', validity:'Valid', lang:'Language', breakMin:(m)=>`${m} min break`, error:"Couldn't load data. Check your connection and try again.", retry:'Retry', new:'New', inMin:(m)=>`in ${dur(m,'h','min')}`, left:(m)=>`${m} min left` },
};

// ---------------------------------------------------------------- state
const hash = new URLSearchParams(location.hash.slice(1));
const store = {
  get(k, d) { try { const v = localStorage.getItem('tt_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) {
    try { localStorage.setItem('tt_' + k, JSON.stringify(v)); } catch {}
    try { if (inTg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) tg.CloudStorage.setItem(k, JSON.stringify(v)); } catch {}
  },
};
const userLang = (inTg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || 'uz';
let lang = hash.get('l') || store.get('lang', null) || (/^ru/.test(userLang) ? 'ru' : /^en/.test(userLang) ? 'en' : 'uz');
if (!I[lang]) lang = 'uz';
let L = I[lang];

const S = {
  tab: 'tt',
  mine: store.get('mine', null),         // {type:'g'|'t'|'r', id, name}
  view: null,                            // entity currently shown in the timetable tab
  stack: [],                             // navigation history (for Telegram back button)
  weekOffset: 0,
  day: null,
  q: '',
  filter: 'all',
  recent: store.get('recent', []),
  favs: store.get('favs', []),
  freeDay: null, freeP: null, freeQ: '',
  browseFac: null,
};

// ---------------------------------------------------------------- data
const cache = {};
async function load(path) {
  if (cache[path]) return cache[path];
  const p = fetch('data/' + path, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  cache[path] = p;
  p.catch(() => delete cache[path]);
  return p;
}
const fileOf = (e) => e.type === 'g' ? `g/${e.id}.json` : e.type === 't' ? `t/${e.id}.json` : `r/${e.id}.json`;

// ---------------------------------------------------------------- time helpers (Tashkent UTC+5)
const TZ = 5 * 3600e3, DAY = 864e5;
const nowT = () => new Date(Date.now() + TZ);
const wd = (d) => (d.getUTCDay() + 6) % 7;
const monday = (d) => { const m = new Date(d.getTime() - wd(d) * DAY); return new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth(), m.getUTCDate())); };
const addD = (d, n) => new Date(d.getTime() + n * DAY);
const sameDay = (a, b) => a.toISOString().slice(0, 10) === b.toISOString().slice(0, 10);
const mins = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const dm = (d) => `${String(d.getUTCDate()).padStart(2, '0')}.${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
function parity(weekA, d) {
  if (!weekA) return null;
  const base = monday(new Date(weekA + 'T00:00:00Z'));
  const diff = Math.round((monday(d) - base) / (7 * DAY));
  return ((diff % 2) + 2) % 2 === 0 ? 'A' : 'B';
}

// ---------------------------------------------------------------- utils
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s || '').toUpperCase().replace(/[‘’ʻʼ`']/g, '').replace(/[^0-9A-ZА-ЯЁЎҚҒҲ]/g, '');
const haptic = (k = 'light') => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(k); } catch {} };
const idOfName = {}; // name → entity (for tapping teacher/room chips)

function splitType(subject) {
  const m = /^(.*?)\s*\(([^()]+)\)\s*$/.exec(subject || '');
  if (!m) return { name: subject, type: null, cls: 'other' };
  const t = m[2].toLowerCase();
  let type = null, cls = 'other';
  if (/^(ma|ma'ruza|лек|лекция|lek|lec)/.test(t)) { type = L.lecture; cls = 'lecture'; }
  else if (/^(sem|сем)/.test(t)) { type = L.seminar; cls = 'seminar'; }
  else if (/^(lab|лаб)/.test(t)) { type = L.lab; cls = 'lab'; }
  else if (/^(amal|пр|prac)/.test(t)) { type = L.practice; cls = 'practice'; }
  else return { name: subject, type: null, cls: 'other' };
  return { name: m[1], type, cls };
}

// ---------------------------------------------------------------- entities & search index
let INDEX = null, PEOPLE = null, ALL = [];
async function ensureIndex() {
  if (INDEX) return;
  INDEX = await load('index.json');
  ALL = [];
  for (const f of INDEX.faculties) for (const c of f.courses) for (const [id, name] of c.groups) {
    ALL.push({ type: 'g', id, name, sub: `${f.name} · ${L.course(c.name)}`, n: norm(name) });
  }
}
async function ensurePeople() {
  if (PEOPLE) return;
  try {
    PEOPLE = await load('people.json');
    for (const [id, name] of PEOPLE.teachers) { const e = { type: 't', id, name, sub: L.teacher, n: norm(name) }; ALL.push(e); idOfName['t:' + name] = e; }
    for (const [id, name] of PEOPLE.rooms) { const e = { type: 'r', id, name, sub: L.room, n: norm(name) }; ALL.push(e); idOfName['r:' + name] = e; }
  } catch { PEOPLE = { teachers: [], rooms: [] }; }
}

function search(q, filter) {
  const nq = norm(q);
  if (!nq) return [];
  const words = String(q).toUpperCase().split(/\s+/).map(norm).filter(Boolean);
  const out = [];
  for (const e of ALL) {
    if (filter !== 'all' && filter !== e.type) continue;
    let score;
    if (e.n === nq) score = 0;
    else if (e.n.startsWith(nq)) score = 1;
    else if (e.n.includes(nq)) score = 2;
    else if (words.length > 1 && words.every(w => e.n.includes(w))) score = 3;
    else {
      // "901" should find "MO-901/26": compare against digits-only too
      const digits = e.n.replace(/[^0-9]/g, '');
      if (/^\d+$/.test(nq) && digits.includes(nq)) score = 4; else continue;
    }
    out.push([score + (e.type === 'g' ? 0 : 0.5), e]);
  }
  out.sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name, undefined, { numeric: true }));
  return out.slice(0, 60).map(x => x[1]);
}

function highlight(name, q) {
  const nq = norm(q);
  if (!nq) return esc(name);
  // map normalized positions back to the original string
  const map = []; let n = '';
  for (let i = 0; i < name.length; i++) { const c = norm(name[i]); if (c) { n += c; for (let k = 0; k < c.length; k++) map.push(i); } }
  const at = n.indexOf(nq);
  if (at < 0) return esc(name);
  const a = map[at], b = map[at + nq.length - 1] + 1;
  return esc(name.slice(0, a)) + '<mark>' + esc(name.slice(a, b)) + '</mark>' + esc(name.slice(b));
}

function remember(e) {
  const item = { type: e.type, id: e.id, name: e.name };
  S.recent = [item, ...S.recent.filter(x => !(x.type === e.type && x.id === e.id))].slice(0, 8);
  store.set('recent', S.recent);
}

async function renderTimetable() {
  const v = S.view;
  const icon = v.type === 'g' ? '👥' : v.type === 't' ? '👤' : '🚪';
  app.innerHTML = `<div class="wrap">${heroHtml(v, '', '')}<div class="spin"></div></div>`;
  bindTitle();
  let data;
  try { data = await load(fileOf(v)); } catch (e) {
    if (String(e.message) === '404') { app.innerHTML = `<div class="wrap">${heroHtml(v, '', '')}<div class="empty">${esc(L.nothing)}</div></div>`; bindTitle(); return; }
    throw e;
  }
  if (v.type !== 'g') await ensurePeople(); else ensurePeople().then(() => {}).catch(() => {});
  const sub = v.type === 'g' ? (data.fac + (data.course ? ' · ' + L.course(data.course) : '')) : (v.type === 't' ? L.teacher : L.room);

  const now = nowT();
  const baseMon = monday(wd(now) === 6 ? addD(now, 1) : now);
  const mon = addD(baseMon, S.weekOffset * 7);
  const par = parity(INDEX.weekA, mon);
  if (S.day == null) S.day = (S.weekOffset === 0 && wd(now) < 6) ? wd(now) : 0;
  const lessonsOf = (d) => (data.lessons || []).filter(l => l.d === d && (!par || !l.w || l.w === par));

  // recently changed lessons (last 7 days)
  const recentChanges = (data.changes || []).filter(c => Date.now() - Date.parse(c.at) < 7 * DAY);
  const newKeys = new Set();
  const changedDays = new Set();
  for (const c of recentChanges) for (const dd of c.days) { changedDays.add(dd.d); for (const l of dd.added) newKeys.add(key(l)); }

  // "Today" summary with a progress bar through the school day — the signature strip under the title
  const nm = now.getUTCHours() * 60 + now.getUTCMinutes();
  let summary = '';
  if (wd(now) < 6) {
    const todays = (data.lessons || []).filter(l => l.d === wd(now) && (!parity(INDEX.weekA, now) || !l.w || l.w === parity(INDEX.weekA, now)));
    if (todays.length) {
      const start = mins(timeOf(todays[0]).a), end = Math.max(...todays.map(l => mins(timeOf(l).b)));
      const endS = `${String(Math.floor(end / 60)).padStart(2, '0')}:${String(end % 60).padStart(2, '0')}`;
      const pct = Math.max(0, Math.min(100, Math.round((nm - start) / (end - start) * 100)));
      summary = `<div class="summary"><span class="bolt">⚡</span><span>${esc(L.todayL)}: ${esc(L.lessonsN(todays.length))} · ${nm >= end ? esc(L.done) : esc(L.until(endS))}</span></div><div class="progress"><b style="width:${pct}%"></b></div>`;
    } else summary = `<div class="summary"><span class="bolt">☀️</span><span>${esc(L.dayOff)}</span></div>`;
  }

  const dayBtns = [0, 1, 2, 3, 4, 5].map(d => {
    const date = addD(mon, d);
    const has = lessonsOf(d).length;
    return `<button class="day ${d === S.day ? 'sel' : ''} ${sameDay(date, now) ? 'today' : ''}" data-d="${d}">
      <div class="dn">${L.dShort[d]}</div><div class="dd">${date.getUTCDate()}</div>
      ${has ? '<span class="dot"></span>' : ''}${changedDays.has(d) && S.weekOffset === 0 ? '<span class="chg"></span>' : ''}</button>`;
  }).join('');

  let banner = '';
  if (recentChanges.length) {
    const c = recentChanges[0];
    const when = new Date(Date.parse(c.at) + TZ);
    const whenS = `${dm(when)} ${String(when.getUTCHours()).padStart(2, '0')}:${String(when.getUTCMinutes()).padStart(2, '0')}`;
    const lines = [];
    for (const dd of c.days) {
      for (const l of dd.removed) lines.push(`<div class="rm">➖ ${esc(L.dShort[dd.d])} ${esc(timeOf(l).a)} ${esc(splitType(l.s).name)}${l.r ? ' · ' + esc(l.r) : ''}</div>`);
      for (const l of dd.added) lines.push(`<div>➕ ${esc(L.dShort[dd.d])} ${esc(timeOf(l).a)} ${esc(splitType(l.s).name)}${l.r ? ' · ' + esc(l.r) : ''}</div>`);
    }
    banner = `<div class="banner"><details><summary>⚠️ <b>${esc(c.newTT ? L.newTT : L.changed)}</b> · <span class="muted small">${esc(L.changedAt(whenS))}</span> ▾</summary><div class="diff">${lines.slice(0, 30).join('')}</div></details></div>`;
  }

  const date = addD(mon, S.day);
  const list = lessonsOf(S.day);
  let body = '';
  if (!list.length) body = `<div class="empty"><div class="big">🎉</div>${esc(L.noLessons)}</div>`;
  else {
    const isToday = sameDay(date, now);
    let nextMarked = false;
    let prevEnd = null;
    body = list.map(l => {
      const t = timeOf(l);
      let cls = '', state = '';
      if (isToday) {
        const a = mins(t.a), b = mins(t.b);
        if (nm >= a && nm < b) { cls = 'now'; state = `<span class="state">● ${esc(L.now)} · ${esc(L.left(b - nm))}</span>`; }
        else if (nm >= b) cls = 'past';
        else if (!nextMarked) { nextMarked = true; state = `<span class="state next">${esc(L.next)} · ${esc(L.inMin(a - nm))}</span>`; }
      }
      let gap = '';
      if (prevEnd != null) { const g = mins(t.a) - prevEnd; if (g >= 30) gap = `<div class="gap">☕ ${esc(L.breakMin(g))}</div>`; }
      prevEnd = mins(t.b);
      return gap + lessonHtml(l, t, cls, state, v, newKeys.has(key(l)) && S.weekOffset === 0, par);
    }).join('');
  }

  const parLbl = par ? ` · ${par === 'A' ? L.weekA : L.weekB}` : '';
  const actions = v.type === 'g'
    ? `<div class="actions"><button class="act" id="weekPic">🖼 ${esc(L.weekPic)}</button><button class="act" id="shareBtn">↗ ${esc(L.share)}</button></div>` : '';
  app.innerHTML = `<div class="wrap">

      <div style="display:flex;gap:6px"><button class="pill ${S.weekOffset === 0 ? 'on' : ''}" data-w="0">${esc(L.thisWeek)}</button><button class="pill ${S.weekOffset === 1 ? 'on' : ''}" data-w="1">${esc(L.nextWeek)}</button></div></div>
    <div class="days">${dayBtns}</div>

    ${actions}

  bindTitle();
  app.querySelectorAll('.day').forEach(b => b.onclick = () => { haptic(); S.day = Number(b.dataset.d); renderTimetable(); });
  app.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { haptic(); S.weekOffset = Number(b.dataset.w); S.day = S.weekOffset === 0 ? null : 0; renderTimetable(); });
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const [type, name] = [b.dataset.open[0], b.dataset.open.slice(2)];
    const e = type === 'g' ? ALL.find(x => x.type === 'g' && x.name === name) : idOfName[type + ':' + name];
    if (e) openEntity(e);

  app.querySelectorAll('.lesson').forEach((el, i) => el.onclick = () => showLesson(list[i], v, par));
  const wp = $('#weekPic');
  if (wp) wp.onclick = () => {
    haptic();
    const src = `img/g/${v.id}.png?v=${data.v || ''}`;
    openSheet(`<h3>${esc(v.name)} — ${esc(L.weekPic)}</h3><a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="${esc(v.name)}"></a>`);
  };
  const sh = $('#shareBtn');
  if (sh) sh.onclick = () => {
    haptic();
    const url = `https://t.me/tdiujadval_bot?start=g_${v.id}`;
    const text = `${v.name} — dars jadvali (TDIU Jadval)`;
    const link = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
    if (inTg && tg.openTelegramLink) tg.openTelegramLink(link); else window.open(link, '_blank');
  };
}

  ensurePeople().then(() => { if (S.tab === 'search' && S.q) drawResults(); });
  app.innerHTML = `<div class="wrap"><div class="hero"><div class="rings"><i></i><i></i></div>
      <div class="hrow"><span class="mark"><img src="icon-192.png" alt=""></span><div class="htitle"><div class="t1">TDIU Jadval</div><div class="t2">${esc(L.pickSub)}</div></div></div>
      <label class="search">🔎<input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="${esc(L.searchPh)}" value="${esc(S.q)}"></label></div>
      <div class="seg">${['all', 'g', 't', 'r'].map(f => `<button class="pill ${S.filter === f ? 'on' : ''}" data-f="${f}">${esc(f === 'all' ? L.all : f === 'g' ? L.groups : f === 't' ? L.teachers : L.rooms)}</button>`).join('')}</div>
    <div id="res"></div>
    <div class="foot"><span class="muted">${esc(L.lang)}:</span> ${['uz', 'ru', 'en'].map(l => `<button class="pill ${l === lang ? 'on' : ''}" data-lang="${l}">${l.toUpperCase()}</button>`).join(' ')}</div>${footHtml('')}</div>`;
  const inp = $('#q');
  inp.oninput = () => { S.q = inp.value; drawResults(); };
  if (!S.mine || S.q) setTimeout(() => inp.focus(), 50);
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { haptic(); S.filter = b.dataset.f; app.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b)); drawResults(); });
  app.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; L = I[lang]; store.set('lang', lang); INDEX = null; PEOPLE = null; render(); });
  drawResults();
}
function bindRows(root) {
  root.querySelectorAll('.row[data-type]').forEach(b => b.onclick = () => {
    const e = ALL.find(x => x.type === b.dataset.type && x.id === b.dataset.id) || S.recent.concat(S.favs).find(x => x.type === b.dataset.type && x.id === b.dataset.id);
    if (e) openEntity(e, { asMine: !S.mine && e.type === 'g' });
  });
}
function drawResults() {
  const res = $('#res'); if (!res) return;
  if (S.q.trim()) {
    const hits = search(S.q, S.filter);
    res.innerHTML = hits.length ? `<div class="rows" style="margin-top:6px">${hits.map(e => entityRow(e, S.q)).join('')}</div>` : `<div class="empty"><div class="big">🤷</div>${esc(L.nothing)}</div>`;
    bindRows(res);
    return;
  }
  let html = '';
  if (!S.mine) html += `<div class="empty" style="padding:24px 10px"><div class="big">👋</div><b>${esc(L.pick)}</b><br><span class="small">${esc(L.pickSub)}</span></div>`;
  if (S.favs.length) html += `<div class="sec">⭐ ${esc(L.favs)}</div><div class="rows">${S.favs.map(e => entityRow(e, '')).join('')}</div>`;
  const rec = S.recent.filter(r => !S.favs.some(f => f.type === r.type && f.id === r.id));
  if (rec.length) html += `<div class="sec">🕘 ${esc(L.recent)}</div><div class="rows">${rec.map(e => entityRow(e, '')).join('')}</div>`;
  // browse by faculty
  html += `<div class="sec">🏛 ${esc(L.browse)}</div>`;
  if (S.browseFac == null) {
    html += `<div class="rows">${INDEX.faculties.map((f, i) => `<button class="row" data-fac="${i}"><span class="ri">🏛</span><span class="rt"><div>${esc(f.name)}</div><div class="rs">${f.courses.reduce((n, c) => n + c.groups.length, 0)} ${esc(L.groups.toLowerCase())}</div></span><span class="chev">›</span></button>`).join('')}</div>`;
  } else {
    const f = INDEX.faculties[S.browseFac];
    html += `<div class="rows"><button class="row" data-fac="-1"><span class="ri">⬅️</span><span class="rt"><div>${esc(f.name)}</div></span></button></div>`;
    for (const c of f.courses) {
      html += `<div class="sec">${esc(L.course(c.name))}</div><div class="grid">${c.groups.map(([id, name]) => `<button class="gbtn" data-gid="${esc(id)}">${esc(name)}</button>`).join('')}</div>`;
    }
  }
  res.innerHTML = html;
  bindRows(res);
  res.querySelectorAll('[data-fac]').forEach(b => b.onclick = () => { haptic(); const i = Number(b.dataset.fac); S.browseFac = i < 0 ? null : i; drawResults(); });
  res.querySelectorAll('[data-gid]').forEach(b => b.onclick = () => { const e = ALL.find(x => x.type === 'g' && x.id === b.dataset.gid); if (e) openEntity(e, { asMine: !S.mine }); });
}

// ---- free rooms tab
async function renderFree() {
  app.innerHTML = `<div class="wrap"><div class="spin"></div></div>`;
  const [busy] = await Promise.all([load('busy.json'), ensurePeople()]);
  const now = nowT();
  const nm = now.getUTCHours() * 60 + now.getUTCMinutes();
  if (S.freeDay == null) {
    S.freeDay = wd(now) === 6 ? 0 : wd(now);
    // current pair, or the next one
    let p = INDEX.periods.find(x => nm < mins(x.end));
    if (!p || wd(now) === 6) { p = INDEX.periods[0]; if (wd(now) !== 6 && nm >= mins(INDEX.periods[INDEX.periods.length - 1].end)) S.freeDay = (S.freeDay + 1) % 6; }
    S.freeP = p.p;
  }
  const mon = monday(wd(now) === 6 ? addD(now, 1) : now);
  const par = parity(INDEX.weekA, mon);
  const slot = `${S.freeDay}.${S.freeP}`;
  const free = [];
  for (const [id, name] of PEOPLE.rooms) {
    const b = busy.rooms[id] || [];
    const taken = b.includes(slot) || (par ? b.includes(slot + par) : (b.includes(slot + 'A') || b.includes(slot + 'B')));
    // only real campus rooms ("8-403-66", "4/1-…"); skip hotels, companies, online etc.
    if (!taken && /^\d/.test(name) && !/online|onlayn|masofa|zoom/i.test(name)) free.push(name);
  }
  const fq = norm(S.freeQ);
  const shown = free.filter(n => !fq || norm(n).includes(fq));
  // group by building: text before the first "-" or "/"
  const groups = {};
  for (const n of shown) { const b = (/^([^-/\s]+)/.exec(n) || [, '?'])[1]; (groups[b] ||= []).push(n); }
  const keys = Object.keys(groups).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const per = INDEX.periods.find(x => x.p === S.freeP);
  app.innerHTML = `<div class="wrap"><div class="hero"><div class="rings"><i></i><i></i></div>
      <div class="hrow"><span class="mark"><img src="icon-192.png" alt=""></span><div class="htitle"><div class="t1">${esc(L.free)}</div><div class="t2">${esc(L.freeFor(L.days[S.freeDay], S.freeP))} · ${esc(per.start)}–${esc(per.end)}</div></div></div>
      <div class="summary"><span class="bolt">🟢</span><span>${esc(L.freeCount(free.length))}</span></div></div><div class="top">
      <div class="slotbar">${[0, 1, 2, 3, 4, 5].map(d => `<button class="pill ${d === S.freeDay ? 'on' : ''}" data-fd="${d}">${esc(L.dShort[d])}</button>`).join('')}</div>
      <div class="slotbar">${INDEX.periods.map(p => `<button class="pill ${p.p === S.freeP ? 'on' : ''}" data-fp="${p.p}">${p.p} · ${esc(p.start)}</button>`).join('')}</div>
      <label class="search">🔎<input id="fq" type="search" placeholder="${esc(L.filterRoom)}" value="${esc(S.freeQ)}"></label>
    </div>
    ${keys.map(k => `<div class="bld"><h4>${esc(/^\d+$/.test(k) ? L.bld(k) : k)} · ${groups[k].length}</h4><div class="rooms">${groups[k].map(n => `<button class="room" data-room="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>`).join('') || `<div class="empty">${esc(L.nothing)}</div>`}
  </div>`;
  app.querySelectorAll('[data-fd]').forEach(b => b.onclick = () => { haptic(); S.freeDay = Number(b.dataset.fd); renderFree(); });
  app.querySelectorAll('[data-fp]').forEach(b => b.onclick = () => { haptic(); S.freeP = Number(b.dataset.fp); renderFree(); });
  app.querySelectorAll('[data-room]').forEach(b => b.onclick = () => { const e = idOfName['r:' + b.dataset.room]; if (e) openEntity(e); });
  const fqi = $('#fq');
  fqi.oninput = () => { S.freeQ = fqi.value; const pos = fqi.selectionStart; renderFree().then(() => { const n = $('#fq'); n.focus(); try { n.setSelectionRange(pos, pos); } catch {} }); };
}

// ---------------------------------------------------------------- start
if (!inTg && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch {} }
(async () => {
  document.documentElement.lang = lang;
  if (hash.get('l')) store.set('lang', lang);
  // Telegram CloudStorage keeps favourites across the user's devices
  if (inTg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) {
    await new Promise(res => {
      tg.CloudStorage.getItems(['mine', 'favs', 'recent'], (err, v) => {
        try {
          if (!err && v) {
            if (v.mine && !S.mine) S.mine = JSON.parse(v.mine);
            if (v.favs && !S.favs.length) S.favs = JSON.parse(v.favs);
            if (v.recent && !S.recent.length) S.recent = JSON.parse(v.recent);
          }
        } catch {}
        res();
      });
      setTimeout(res, 800);
    });
  }
  const gid = hash.get('g') || hash.get('t') || hash.get('r');
  if (gid) {
    try {
      await ensureIndex();
      const type = hash.get('g') ? 'g' : hash.get('t') ? 't' : 'r';
      if (type !== 'g') await ensurePeople();
      const e = ALL.find(x => x.type === type && x.id === gid);
      if (e) { if (type === 'g') { S.mine = { type, id: e.id, name: e.name }; store.set('mine', S.mine); } S.view = { type, id: e.id, name: e.name }; remember(e); }
    } catch {}
  }
  render();
})();
})();
</script>
